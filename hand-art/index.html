<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-visual">
<title>Hand Flow Art</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="fonts/gowun-batang.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--mtxt:#fff;--bg:#000;--glass:rgba(12,20,38,.62);--line:rgba(255,255,255,.14);--ink:#f4efe4;--mute:rgba(244,239,228,.66);--accent:#f7c844}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;left:50%;top:50%;width:100vw;height:100vh;overflow:hidden;transform:translate(-50%,-50%);transform-origin:50% 50%}
canvas#art,canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
.bar{display:block;width:56px;height:5px;border-radius:3px;background:rgba(190,196,206,.55);transition:background .35s,box-shadow .35s}
body.detect .bar{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.95)}
#cap{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);z-index:8;display:flex;justify-content:space-between;align-items:center;padding:4px 4px 8px;pointer-events:none}
#cap .grp{display:flex;align-items:center;gap:0;pointer-events:auto}
#cap button{width:46px;height:50px;border:0;background:transparent;padding:0;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer}            /* big invisible touch area around each round button */
#cap .ring{width:34px;height:34px;border-radius:17px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,16,.40);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
#cap button:active .ring{transform:scale(.9)}
#cap svg{width:20px;height:20px}
#gestBtn.on .ring{background:rgba(255,255,255,.92);color:#111;border-color:#fff}
body.detect #gestBtn.on .ring{box-shadow:0 0 12px rgba(255,255,255,.9)}
#gestBtn.busy .ring{animation:gbusy 1s ease-in-out infinite}
@keyframes gbusy{50%{opacity:.45}}
#recBtn .dot{width:13px;height:13px;border-radius:7px;background:#ff3b30;transition:border-radius .2s,width .2s,height .2s}
#recBtn.on .dot{width:11px;height:11px;border-radius:2px}
#recTime{font:600 12px/1 system-ui,sans-serif;margin-left:2px;color:#fff;background:rgba(255,59,48,.85);padding:5px 8px;border-radius:10px;display:none;font-variant-numeric:tabular-nums}
body.rec #recTime{display:block}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7;transition:opacity .35s}
#grab{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(env(safe-area-inset-bottom) + 64px);display:flex;justify-content:center;padding-top:30px;touch-action:none;transition:opacity .3s}
body.menu #grab{opacity:0;pointer-events:none}
.head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 12px;touch-action:none}
#status{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:center}
#status:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(190,196,206,.6);flex:0 0 auto}
body.detect #status:before{background:#fff;box-shadow:0 0 8px #fff}
.dock{position:fixed;left:50%;bottom:0;z-index:6;transform:translate(-50%,calc(100% + 24px));width:100%;max-width:430px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.menu .dock{transform:translate(-50%,0)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:8px}
.row+.row{margin-top:10px}
.chips{overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;padding:8px 12px 8px 8px;font:inherit;font-size:16px}
.chip i{display:flex;width:44px;height:18px;border-radius:9px;overflow:hidden}
.chip i span{flex:1}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(247,200,68,.14)}
.btn{flex:1;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;font-weight:600}
.btn.main{flex:1.6;background:var(--ink);color:#101826;border-color:transparent}
.btn.main.on{background:#d8262c;color:#fff}
#gyroBtn.on{background:var(--ink);color:#101826}
.btn:active,.chip:active{transform:scale(.97)}
#install{display:none}
.speed{display:flex;align-items:center;gap:12px;margin:0 2px 12px;touch-action:none}
.speed span{font-size:16px;color:var(--mute);flex:0 0 auto}
.speed b{font-size:16px;font-weight:600;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#speed,#plopSize{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;touch-action:none}
#plopSize::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#3a6a7a,#8fd3e8)}
#plopSize::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#3a6a7a,#8fd3e8)}
#speed::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#plopSize::-webkit-slider-thumb,#speed::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
#speed::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#plopSize::-moz-range-thumb,#speed::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.seg{gap:0;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:14px;padding:3px;background:rgba(255,255,255,.04)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:0 10px;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-size:16px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#101826}
body.water #palettes,body.wave #palettes,body.halo #palettes,body.light #palettes,body.silk #palettes,body.cloud #palettes{display:none}
body:not(.cloud) #clouds{display:none}
body:not(.ink) #inks{display:none}
body.ink #palettes,body.splash #palettes,body.cosmos #palettes{display:none}
body:not(.splash) #splashRow{display:none}
body:not(.silk) #silks{display:none}
body:not(.light) #lights{display:none}
body:not(.water) #plopRow,body:not(.water) #floors,body:not(.water) #dipRow,body:not(.water) #rainRow{display:none}
#rainRow{margin-bottom:10px}
#rangeRow{margin-top:10px}
body:not(.halo) #haloColRow,body:not(.halo) #beadRow{display:none}
#dipRow{margin-bottom:10px}
#dipBtn.on{background:var(--ink);color:#101826}
.chip i.sw{width:24px;height:18px;border-radius:9px;border:1px solid rgba(255,255,255,.25)}
.hint{font-size:16px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
/* ---- 마음 남기기 ---- */
#mind{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9;display:none;flex-direction:column;touch-action:auto;user-select:text;-webkit-user-select:text;
  background:rgba(0,0,0,.68)}                                  /* the art keeps flowing underneath at about 30% */
body.mind #mind{display:flex}
body.mind #grab,body.mind #cap,body.mind .dock{display:none}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 8px 4px}
.mhead button{width:52px;height:52px;border:0;background:transparent;color:var(--mtxt);display:flex;align-items:center;justify-content:center}
.mhead svg{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35)) drop-shadow(0 2px 8px rgba(0,0,0,.35))}   /* the same white and the same soft shadow as the letters */
#mMusic.off{opacity:.45}
.mtitle{font-size:22px;font-weight:600;color:#fff;letter-spacing:.02em;text-shadow:0 1px 10px rgba(0,0,0,.45)}
.mbody{flex:1;display:flex;flex-direction:column;padding:28px 28px 0;min-height:0}
#mind .mdate,#mView .mdate{font-family:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR",serif;color:rgba(255,255,255,.78);font-size:16px;margin-bottom:16px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.mwrap{position:relative;flex:1;min-height:0}
#mText,#mFly{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;outline:0;resize:none;background:transparent;color:var(--mtxt);
  font:400 25px/1.8 "Gowun Batang","Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR",serif;letter-spacing:.01em;
  text-shadow:0 1px 3px rgba(0,0,0,.35),0 2px 16px rgba(0,0,0,.35);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;caret-color:#fff}
#mText{overflow:auto}
#mText::placeholder{color:rgba(255,255,255,.55)}
#mFly{pointer-events:none;overflow:visible}
#mFly span{display:inline-block;transition-property:transform,opacity,filter;transition-timing-function:cubic-bezier(.3,.1,.3,1)}
.mfoot{display:flex;gap:14px;padding:12px 20px calc(env(safe-area-inset-bottom) + 18px)}
.mbtn{flex:1;height:54px;border-radius:27px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;font:600 18px/1 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.mbtn:active{transform:scale(.97);background:rgba(255,255,255,.24)}
.mbtn.solid{background:rgba(255,255,255,.88);color:#14202a;text-shadow:none;border-color:transparent}
.mbtn.danger{color:#ffb3ad}
#mModal{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:auto;padding:20px}
#mModal.on{display:flex}
.mcard{width:100%;max-width:380px;max-height:100%;overflow:auto;background:rgba(18,26,36,.78);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:26px 20px 20px;color:#fff;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:center}
.mcard h3{font-size:20px;font-weight:600;margin-bottom:8px}
.mcard p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.5;margin-bottom:18px}
.mcard .mbtns{display:flex;flex-direction:column;gap:10px}
.mcard .mbtn{flex:0 0 auto;height:52px}
.mdots{display:flex;justify-content:center;gap:18px;margin:6px 0 22px}
.mdots i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
.mdots i.f{background:#fff;border-color:#fff}
.mdots.shake{animation:mshake .4s}
@keyframes mshake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.mpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.mpad button{height:60px;border-radius:30px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font:500 24px/1 system-ui,sans-serif}
.mpad button:active{background:rgba(255,255,255,.22)}
.mpad button.x{border:0;background:transparent;font-size:20px}
.mlink{border:0;background:transparent;color:rgba(255,255,255,.66);font:inherit;font-size:15px;padding:10px;text-decoration:underline;text-underline-offset:3px}
.mlist{display:flex;flex-direction:column;gap:10px;text-align:left;margin-bottom:14px}
.mcard.klist{display:flex;flex-direction:column;overflow:hidden}
.mcard.klist .mlist{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.mcard.klist .mbtns{flex:0 0 auto}
#mCard.arming{pointer-events:none}   /* a tap that was meant for the button underneath never lands on what just appeared */
.mitem{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:16px;padding:8px;color:#fff;font:inherit;text-align:left}
.mitem .mthumb{width:52px;height:52px;border-radius:14px;flex:0 0 auto;object-fit:cover;background:#111;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.mrow{position:relative}
.mrow .mitem{width:100%;padding-right:52px}
.mitem>div{flex:1;min-width:0}
.mtrash{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center}
.mtrash:active{background:rgba(255,255,255,.12)}
.mtrash svg{width:22px;height:22px}
.mitem b{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.65);margin-bottom:3px}
.mitem span{display:block;font-size:16px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#mView{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:transparent;touch-action:auto}
#mView.on{display:flex}
#mView .mbtn[hidden]{display:none}
#mView .mveil{position:absolute;inset:0;background:rgba(0,0,0,.68)}
body.mview #grab,body.mview #cap,body.mview .dock{display:none}
#mView > *:not(.mveil){position:relative}
#mView .mread{flex:1;overflow:auto;color:var(--mtxt);font:400 25px/1.8 "Gowun Batang","Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR",serif;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
  text-shadow:0 1px 3px rgba(0,0,0,.35),0 2px 16px rgba(0,0,0,.35);user-select:text;-webkit-user-select:text;
  width:100%;min-height:0;padding:0;border:0;outline:0;resize:none;background:transparent;caret-color:#fff;letter-spacing:.01em}   /* a kept note can be rewritten in place */
#mToast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);z-index:12;opacity:0;pointer-events:none;
  background:rgba(18,26,36,.86);color:#fff;border-radius:20px;padding:11px 18px;font-size:15px;transition:opacity .3s,transform .3s;white-space:nowrap}
#mToast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="video" playsinline muted style="display:none"></video>

<div id="cap"><div class="grp"><button id="recBtn" aria-label="녹화"><span class="ring"><span class="dot"></span></span></button>
  <button id="shotBtn" aria-label="캡처"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.2" r="3.6"/></svg></span></button><span id="recTime">0:00</span></div>
  <div class="grp">
  <button id="penBtn" aria-label="마음 남기기"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/></svg></span></button>
  <button id="bookBtn" aria-label="간직한 마음 리스트"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r=".9" fill="currentColor"/><circle cx="4.6" cy="12" r=".9" fill="currentColor"/><circle cx="4.6" cy="17.5" r=".9" fill="currentColor"/></svg></span></button>
  <button id="gestBtn" aria-label="손 인식 켜기"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 12.2V5.6a1.35 1.35 0 0 1 2.7 0v5.6M10.9 11.2V4.2a1.35 1.35 0 0 1 2.7 0v7M13.6 11.2V5.4a1.35 1.35 0 0 1 2.7 0v6.4M16.3 11.8V8.6a1.35 1.35 0 0 1 2.7 0v5.2a6.6 6.6 0 0 1-6.6 6.6h-.9a5.6 5.6 0 0 1-4.7-2.6l-2.3-3.6a1.4 1.4 0 0 1 2.2-1.7l1.6 1.9"/></svg></span></button></div></div>
<div id="flash"></div>
<div id="grab" aria-label="메뉴 열기"><span class="bar"></span></div>

<div class="dock" id="sheet">
  <div class="panel">
    <div class="head" id="sheetHead"><span class="bar"></span><div id="status">손 인식 꺼짐 · 화면을 문질러 보세요</div></div>
    <div class="row seg" id="modeSeg"><button data-m="paint">Pigment</button><button data-m="water">Ripple</button><button data-m="wave">Wave</button><button data-m="light">Aurora</button><button data-m="silk">Silk</button><button data-m="cloud">Cloud</button><button data-m="halo">Halo</button><button data-m="ink">Ink</button><button data-m="splash">Splash</button><button data-m="cosmos">Cosmos</button></div>
    <div class="speed"><span>흐름 속도</span><input type="range" id="speed" min="0" max="100" step="1"><b id="speedVal"></b></div>
    <div class="speed" id="plopRow"><span>퐁당 크기</span><input type="range" id="plopSize" min="0" max="100" step="1" aria-label="퐁당 크기"><b id="plopVal"></b></div>
    <div class="row chips" id="palettes"></div>
    <div class="row chips" id="lights"></div>
    <div class="row chips" id="silks"></div>
    <div class="row chips" id="clouds"></div>
    <div class="row chips" id="inks"></div>
    <div class="row chips" id="splashRow"><button class="chip" data-sb="0"><i class="sw" style="background:#000"></i>검은 배경</button><button class="chip" data-sb="1"><i class="sw" style="background:#f6f5f2"></i>흰 배경</button></div>
    <div class="row chips" id="rainRow"><button class="chip" data-r="0">비 없음</button><button class="chip" data-r="1">이슬비</button><button class="chip" data-r="2">비</button><button class="chip" data-r="3">소나기</button></div>
    <div class="row" id="dipRow"><button class="btn" id="dipBtn">손 담그기 켜기</button></div>
    <div class="row chips" id="haloColRow"><button class="chip" data-hc="white">링 화이트</button><button class="chip" data-hc="random">링 색 랜덤</button></div>
    <div class="speed" id="beadRow"><span>구슬 배경</span><input type="range" id="beadSize" min="20" max="100" step="1" aria-label="구슬 배경 범위"><b id="beadVal"></b></div>
    <div class="row chips" id="floors"><button class="chip" data-f="2"><i class="sw" style="background:linear-gradient(135deg,#000,#1b1d20 50%,#000)"></i>검은 유리</button><button class="chip" data-f="1"><i class="sw" style="background:linear-gradient(135deg,#1c2328,#3a464e 50%,#11171b)"></i>다크 그레이</button><button class="chip" data-f="3"><i class="sw" style="background:#1d2024;background-image:linear-gradient(#5a5f66 1.5px,transparent 1.5px),linear-gradient(90deg,#5a5f66 1.5px,transparent 1.5px);background-size:8px 8px"></i>그레이 타일</button><button class="chip" data-f="0"><i class="sw" style="background:linear-gradient(135deg,#8c8270,#c9bda4 45%,#6e675c)"></i>자갈</button></div>
    <div class="speed" id="rangeRow"><span>손 인식 범위</span><input type="range" id="handRange" min="0" max="100" step="1" aria-label="손 인식 범위"><b id="handRangeVal"></b></div>
    <div class="row chips" id="engRow"><button class="chip" data-e="tasks">새 손 인식</button><button class="chip" data-e="legacy">기존 손 인식</button></div>
    <div class="row">
      <button class="btn main" id="camBtn">손 인식 시작</button>
      <button class="btn" id="seedBtn">새 캔버스</button>
      <button class="btn" id="snapBtn">저장</button>
    </div>
    <div class="row">
      <button class="btn" id="musicBtn">음악 끄기</button>
      <button class="btn" id="gyroBtn">흔들기 켜기</button>
      <button class="btn" id="fsBtn">전체화면</button>
      <button class="btn" id="install">앱 설치</button>
    </div>
    <div class="row"><button class="btn" id="pinBtn">비밀번호 바꾸기</button></div>

const TRACKS={cloud:'audio/velvet_horizon.mp3',cosmos:'audio/where_the_ocean_meets_sky.mp3',halo:'audio/beneath_the_haloed_glass.mp3',paint:'audio/where_the_stream_widens.mp3',water:'audio/glass_upon_the_lake.mp3',light:'audio/where_the_ocean_meets_sky.mp3',wave:'audio/where_the_ocean_meets_sky.mp3',ink:'audio/silk_and_moonlight.mp3'};
const trackURL={};
function getTrack(path){ if(!trackURL[path])trackURL[path]=fetch(path).then(r=>r.blob()).then(b=>URL.createObjectURL(b)).catch(()=>null); return trackURL[path]; }
// change song: the playing one fades out on its own player, the new one starts silent on the other player and fades in
async function switchTrack(){ const path=TRACKS[mode]||TRACKS.paint; wantTrack=path;
  if(path===curTrack)return;
  const u=await getTrack(path); if(wantTrack!==path||!u)return;            // the mode changed again meanwhile
  const old=bgm,next=players[0]===old?players[1]:players[0];
  if(!next.paused&&next.vol>.02){next.pause();}                           // a third quick switch: the oldest one just stops
  next.src=u;next.vol=0;next.volume=0;try{next.currentTime=0;}catch(e){}
  bgm=next;curTrack=path;
  if(musicOn&&!document.hidden)next.play().catch(()=>{});}

  if(bgm.paused&&bgm.src&&!document.hidden)bgm.play().catch(()=>{}); }
function updateMusic(dt){
  dt=Math.min(dt,.1);
  for(const a of players){if(a.paused||!a.src)continue;
    if(a.playbackRate!==1)a.playbackRate=1;               // always the original tempo
    const target=(a===bgm&&musicOn)?MUSIC_VOL:0;
    const step=target>a.vol?dt*MUSIC_VOL/FADE_IN:-dt*MUSIC_VOL/FADE_OUT;
    a.vol=step>0?Math.min(target,a.vol+step):Math.max(target,a.vol+step);
    a.volume=Math.max(0,Math.min(1,a.vol*a.vol/MUSIC_VOL));            // eased curve: soft start, soft end

function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+'-'+z(d.getMinutes())+'-'+z(d.getSeconds());}
async function saveNative(b,ext,sfx=''){   // 안드로이드 앱(APK) 안에서는 갤러리에 바로 저장
  const S=window.AndroidSave;const id=S.begin('hand-flow-'+stamp()+sfx+'.'+ext,b.type||(ext==='mp4'?'video/mp4':ext==='webm'?'video/webm':'image/jpeg'));if(id<0)return false;
  const CH=786432;for(let o=0;o<b.size;o+=CH){const u=new Uint8Array(await b.slice(o,o+CH).arrayBuffer());let t='';
    for(let i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));if(!S.append(id,btoa(t)))return false;}
  return S.end(id);}
function saveBlob(b,ext,sfx=''){if(window.AndroidSave)return saveNative(b,ext,sfx).then(ok=>{if(!ok)saveWeb(b,ext,sfx);}).catch(()=>saveWeb(b,ext,sfx));saveWeb(b,ext,sfx);return Promise.resolve();}
function saveWeb(b,ext,sfx=''){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hand-flow-'+stamp()+sfx+'.'+ext;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);}

let rec=null,recChunks=[],recT0=0,recTimer=0,recExt='mp4';
function recAudioTracks(){try{
  if(!musicOn)return [];
  const cs=bgm.captureStream||bgm.mozCaptureStream;if(cs&&!bgm.paused)return cs.call(bgm).getAudioTracks();}catch(e){}return [];}
function recStart(){
  if(!canvas.captureStream||typeof MediaRecorder==='undefined'){status('이 브라우저는 화면 녹화를 지원하지 않아요');return;}
  const vs=canvas.captureStream(60),stream=new MediaStream([...vs.getVideoTracks(),...recAudioTracks()]);
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const type=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  recExt=type.startsWith('video/mp4')?'mp4':'webm';
  try{rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:12e6}:{videoBitsPerSecond:12e6});}catch(e){status('녹화를 시작하지 못했어요');rec=null;return;}
  recChunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  rec.onstop=()=>{const b=new Blob(recChunks,{type:rec&&rec.mimeType||type||'video/mp4'});vs.getTracks().forEach(t=>t.stop());rec=null;
    if(b.size)saveBlob(b,recExt);if(recExt!=='mp4')status('이 브라우저는 MP4 녹화를 지원하지 않아 WebM으로 저장했어요');};
  rec.start(1000);recT0=performance.now();recBtn.classList.add('on');document.body.classList.add('rec');recBtn.setAttribute('aria-label','녹화 중지');
  const tick=()=>{const t=Math.floor((performance.now()-recT0)/1000);recTime.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
  tick();recTimer=setInterval(tick,500);}
function recStop(){if(rec&&rec.state!=='inactive')rec.stop();clearInterval(recTimer);recBtn.classList.remove('on');document.body.classList.remove('rec');recBtn.setAttribute('aria-label','녹화');}

// ---- the art behind, as a picture ----
const artGrabQ=[];
function grabArt(){return new Promise(r=>artGrabQ.push(r));}
function artGrabStep(){if(!artGrabQ.length)return;const sc=Math.min(1,1440/Math.max(canvas.width,canvas.height));
  const c=document.createElement('canvas');c.width=Math.round(canvas.width*sc);c.height=Math.round(canvas.height*sc);c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);
  artGrabQ.splice(0).forEach(r=>r(c));}
// text + the art = one picture to share
function wrapLines(ctx,text,maxW){const out=[];for(const para of text.split('\n')){let line='';
    for(const ch of para){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){let cut=line.lastIndexOf(' ');
        if(cut>line.length*.5){out.push(line.slice(0,cut));line=line.slice(cut+1)+ch;}else{out.push(line);line=ch;}}else line=t;}
    out.push(line);}return out;}
async function mindFont(text){try{await document.fonts.load('400 40px "Gowun Batang"',text+fmtDate(Date.now())+'Hand Flow Art · 마음 남기기');}catch(e){}}
function composeMind(art,text,t){const W=art.width,H=art.height,u=Math.min(W,H),pad=u*.085,ff='"Gowun Batang","Noto Serif KR","Noto Serif CJK KR",serif';
  const fs=u*.056,lh=fs*1.7,y0=H*.12+u*.07,yEnd=H-pad*1.9;              // one fixed, easy-to-read size; long words run onto more pages instead of shrinking
  const m=document.createElement('canvas').getContext('2d');m.font=`400 ${Math.round(fs)}px ${ff}`;const lines=wrapLines(m,text,W-pad*2);
  const per=Math.max(1,Math.floor((yEnd-y0)/lh)),pages=[];let k=0;
  while(k<lines.length){if(pages.length)while(k<lines.length&&!lines[k].trim())k++;   // a new page never starts with blank lines
    if(k>=lines.length)break;pages.push(lines.slice(k,k+per));k+=per;}
  if(!pages.length)pages.push(['']);
  return pages.map((pl,pi)=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.drawImage(art,0,0);
    x.fillStyle='rgba(0,0,0,.68)';x.fillRect(0,0,W,H);                  // the same dim veil as on screen while writing (art at ~30%) → the words stand out
    x.fillStyle='rgba(255,255,255,.80)';x.font=`400 ${Math.round(u*.034)}px ${ff}`;x.textBaseline='top';
    x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=u*.012;x.fillText(fmtDate(t),pad,H*.12);
    x.font=`400 ${Math.round(fs)}px ${ff}`;x.fillStyle='#fff';x.shadowBlur=u*.02;pl.forEach((l,i)=>x.fillText(l,pad,y0+i*lh));
    x.shadowBlur=0;x.fillStyle='rgba(255,255,255,.55)';x.font=`400 ${Math.round(u*.026)}px ${ff}`;
    if(pages.length>1){x.textAlign='left';x.fillText((pi+1)+' / '+pages.length,pad,H-pad*.9);}
    x.textAlign='right';x.fillText('Hand Flow Art · 마음 남기기',W-pad,H-pad*.9);
    return c;});}
const toJpg=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92));
async function saveMind(pages){for(let i=0;i<pages.length;i++){const b=await toJpg(pages[i]);if(b)await saveBlob(b,'jpg',pages.length>1?'_'+(i+1)+'of'+pages.length:'');
    if(i<pages.length-1)await new Promise(r=>setTimeout(r,350));}
  mindFlash();mToast(pages.length>1?`이미지 ${pages.length}장으로 저장했어요`:'이미지로 저장했어요');}
async function shareMind(pages,text){const blobs=(await Promise.all(pages.map(toJpg))).filter(Boolean);if(!blobs.length)return;
  const st=stamp(),files=blobs.map((b,i)=>new File([b],'hand-flow-maeum-'+st+(blobs.length>1?'_'+(i+1)+'of'+blobs.length:'')+'.jpg',{type:'image/jpeg'}));
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);}catch(e){}
  for(let i=0;i<blobs.length;i++){await saveBlob(blobs[i],'jpg',blobs.length>1?'_'+(i+1)+'of'+blobs.length:'');if(i<blobs.length-1)await new Promise(r=>setTimeout(r,350));}
  mToast((blobs.length>1?`그림 ${blobs.length}장을`:'그림을')+' 저장했어요 · 글은 복사해 두었어요');}

// ---- the locked box: AES-GCM with a key made from the 4-digit PIN; everything stays in this phone's storage ----
const MIND_META='hf-mind-lock';let mindKey=null;
const te=new TextEncoder(),td=new TextDecoder();
function mindMeta(){try{return JSON.parse(localStorage.getItem(MIND_META)||'null');}catch(e){return null;}}
let MIND_ITERS=120000;
async function pinKey(pin,salt,it){const base=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:new Uint8Array(salt),iterations:it||MIND_ITERS,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encJ(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));return {iv:[...iv],ct:new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))))};}
async function decJ(key,r){return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(r.iv)},key,r.ct)));}
function mindDB(){return new Promise((res,rej)=>{const q=indexedDB.open('hf-mind',1);q.onupgradeneeded=()=>q.result.createObjectStore('notes',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbDo(mode,fn){const db=await mindDB();return new Promise((res,rej)=>{const tx=db.transaction('notes',mode),st=tx.objectStore('notes');const q=fn(st);
  tx.oncomplete=()=>{res(q&&q.result);db.close();};tx.onerror=()=>{rej(tx.error);db.close();};});}
document.addEventListener('visibilitychange',()=>{if(document.hidden)mindKey=null;});   // leaving the app locks the box again
// PIN pad: 'create' (twice) or 'unlock' → resolves with the key, or null
function askPin(kind,opt){opt=opt||{};return new Promise(done=>{let entered='',first=null;
  const draw=(title,sub)=>{mCard.innerHTML=`<h3>${title}</h3><p>${sub}</p><div class="mdots">${[0,1,2,3].map(i=>`<i class="${i<entered.length?'f':''}"></i>`).join('')}</div>
    <div class="mpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="x" data-k="c">취소</button><button data-k="0">0</button><button class="x" data-k="b">⌫</button></div>
    ${kind==='unlock'&&!opt.meta?'<button class="mlink" data-k="f">비밀번호를 잊었어요</button>':''}`;
    mCard.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));};
  const T=()=>kind==='create'?(first?['한 번 더 입력해 주세요','확인을 위해 같은 번호를 입력해 주세요']:(opt.title?[opt.title,opt.sub||'']:['비밀번호 4자리를 만들어 주세요','간직한 마음은 이 휴대폰에만 잠겨 저장되고,<br>이 번호로만 꺼낼 수 있어요'])):(opt.title?[opt.title,opt.sub||'']:['비밀번호 4자리','간직한 마음을 여는 번호를 입력해 주세요']);
  const shake=msg=>{entered='';draw(...T());const d=mCard.querySelector('.mdots');d.classList.add('shake');if(msg)mCard.querySelector('p').innerHTML=msg;};
  const fin=k=>{mModal.classList.remove('on');done(k);};
  async function press(k){
    if(k==='c')return fin(null);
    if(k==='f'){mCard.innerHTML=`<h3>비밀번호를 잊으셨나요?</h3><p>번호는 이 휴대폰 어디에도 따로 남지 않아 찾을 수 없어요.<br>처음부터 다시 시작하면 간직한 마음이 모두 지워져요.</p>
      <div class="mbtns"><button class="mbtn danger" id="mR">모두 지우고 새로 시작</button><button class="mbtn" id="mRc">돌아가기</button></div>`;
      document.getElementById('mRc').onclick=()=>{entered='';draw(...T());};
      document.getElementById('mR').onclick=async()=>{try{await dbDo('readwrite',st=>st.clear());}catch(e){}try{localStorage.removeItem(MIND_META);}catch(e){}mindKey=null;fin(null);mToast('모두 지웠어요');};return;}
    if(k==='b'){entered=entered.slice(0,-1);return draw(...T());}
    if(entered.length>=4)return;entered+=k;draw(...T());if(entered.length<4)return;
    await new Promise(r=>setTimeout(r,120));
    if(kind==='create'){
      if(!first){first=entered;entered='';return draw(...T());}
      if(first!==entered){first=null;return shake('번호가 달라요. 처음부터 다시 만들어 주세요');}
      const salt=[...crypto.getRandomValues(new Uint8Array(16))],key=await pinKey(entered,salt);
      return fin({key,salt});}
    const m=opt.meta||mindMeta();if(!m)return fin(null);
    try{const key=await pinKey(entered,m.salt,m.it);const ok=await decJ(key,{iv:m.iv,ct:new Uint8Array(m.ct)});if(ok&&ok.ok==='hand-flow')return fin(key);}catch(e){}
    shake('번호가 맞지 않아요');}
  draw(...T());mShow();});}
// the box has a lock pair: notes are sealed with the public half (no PIN needed to put one in),
// and only the private half — itself locked by the PIN — can open them
const RSA={name:'RSA-OAEP',hash:'SHA-256'};
async function mindWrapPriv(priv,pinK,salt,pub){const pk=new Uint8Array(await crypto.subtle.exportKey('pkcs8',priv)),iv=crypto.getRandomValues(new Uint8Array(12));
  const pct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},pinK,pk)),chk=await encJ(pinK,{ok:'hand-flow'});
  localStorage.setItem(MIND_META,JSON.stringify({v:2,salt,it:MIND_ITERS,iv:chk.iv,ct:[...chk.ct],pub,piv:[...iv],pct:[...pct]}));}
async function mindSetup(pinK,salt){const kp=await crypto.subtle.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,['encrypt','decrypt']);
  const pub=[...new Uint8Array(await crypto.subtle.exportKey('spki',kp.publicKey))];await mindWrapPriv(kp.privateKey,pinK,salt,pub);return kp.privateKey;}
async function mindPriv(pinK){const m=mindMeta();
  if(m&&m.pub){const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(m.piv)},pinK,new Uint8Array(m.pct));return crypto.subtle.importKey('pkcs8',pk,RSA,true,['decrypt']);}
  const priv=await mindSetup(pinK,m.salt);await mindMigrate(pinK);return priv;}                     // an older box: give it the lock pair once
async function sealNote(obj){const m=mindMeta(),pub=await crypto.subtle.importKey('spki',new Uint8Array(m.pub),RSA,false,['encrypt']);
  const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),r=await encJ(k,obj);
  const wk=new Uint8Array(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',k)));return {iv:r.iv,ct:r.ct,wk};}
async function openNote(K,r){if(r.wk){const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},K.priv,r.wk);return decJ(await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']),r);}
  return decJ(K.pin,r);}
async function mindMigrate(pinK){let recs=[];try{recs=await dbDo('readonly',st=>st.getAll());}catch(e){}
  for(const r of recs){if(r.wk)continue;try{const d=await decJ(pinK,r);const n=await sealNote(d);await dbDo('readwrite',st=>st.put({id:r.id,...n}));}catch(e){}}}
async function mindUnlock(){if(mindKey)return mindKey;
  if(!mindMeta()){const r=await askPin('create');if(!r)return null;const priv=await mindSetup(r.key,r.salt);return mindKey={pin:r.key,priv};}
  const pin=await askPin('unlock');if(!pin)return null;return mindKey={pin,priv:await mindPriv(pin)};}
async function changePin(){openMenu(false);if(!mindMeta())return mToast('아직 만든 비밀번호가 없어요');
  const pin=await askPin('unlock',{title:'지금 비밀번호','sub':'먼저 지금 쓰는 번호를 입력해 주세요'});if(!pin)return;
  const priv=await mindPriv(pin);await mindMigrate(pin);
  const r=await askPin('create',{title:'새 비밀번호 4자리','sub':'새로 쓸 번호를 입력해 주세요'});if(!r)return;
  await mindWrapPriv(priv,r.key,r.salt,mindMeta().pub);mindKey=null;mToast('비밀번호를 바꿨어요');}
// a small menu card (after writing, or confirmations)
function mMenu(title,sub,items){return new Promise(done=>{mCard.innerHTML=`<h3>${title}</h3>${sub?`<p>${sub}</p>`:''}<div class="mbtns">${items.map((it,i)=>`<button class="mbtn ${it.cls||''}" data-i="${i}">${it.t}</button>`).join('')}</div>`;
  mCard.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{mModal.classList.remove('on');done(items[+b.dataset.i].v);});mShow();});}

// ---- keep ----
document.getElementById('mKeep').onclick=async()=>{const text=mText.value.trim();if(!text){mText.focus();return mToast('먼저 마음을 적어 주세요');}
  try{mText.blur();}catch(e){}
  const m0=mindMeta();if(!m0||!m0.pub){if(!await mindUnlock())return;}   // the PIN is asked only the very first time (or once to upgrade an older box)
  const t=Date.now();
  try{const n=await sealNote({text,t,mode});await dbDo('readwrite',st=>st.put({id:t,...n}));}   // only the words (sealed) and which mode it was written in
  catch(e){console.warn(e);return mToast('저장하지 못했어요');}
  mText.value='';
  const v=await mMenu('마음을 간직했어요','이 휴대폰에만, 비밀번호로 잠겨 있어요',[{t:'리스트 보기',v:'list',cls:'solid'},{t:'닫기',v:'close'}]);
  closeMind();if(v==='list')openKept();};
// ---- let it flow away ----
document.getElementById('mLet').onclick=async()=>{const text=mText.value;if(!text.trim()){mText.focus();return mToast('먼저 마음을 적어 주세요');}
  try{mText.blur();}catch(e){}
  const art=await grabArt(),t=Date.now();await mindFont(text);const pic=composeMind(art,text.trim(),t);
  await mindDissolve(text);mText.value='';
  const v=await mMenu('흘려보냈어요','글은 어디에도 남지 않았어요',[{t:'공유하기',v:'share',cls:'solid'},{t:'다시 쓰기',v:'again'},{t:'닫기',v:'close'}]);
  mFly.innerHTML='';mText.style.visibility='';
  if(v==='share'){await shareMind(pic,text.trim());closeMind();}else if(v==='again'){try{mText.focus();}catch(e){}}else closeMind();};
// the letters leave the way this mode moves: sink in water, bleed into hanji, blow away on the silk wind, fall into the ring…
function mindDissolve(text){return new Promise(done=>{
  mFly.innerHTML='';mFly.scrollTop=0;const top=mText.scrollTop;
  for(const ch of text){if(ch==='\n'){mFly.appendChild(document.createElement('br'));continue;}
    if(ch===' '){mFly.appendChild(document.createTextNode(' '));continue;}const s=document.createElement('span');s.textContent=ch;mFly.appendChild(s);}
  mFly.style.transform=`translateY(${-top}px)`;mText.style.visibility='hidden';
  const spans=[...mFly.querySelectorAll('span')],n=spans.length;
  const hc=(mode==='halo'&&halo)?haloProj(halo.C):null;
  spans.forEach((s,i)=>{const d=.15+Math.random()*1.1+i/n*.6,du=1.6+Math.random()*1.2;
    s.style.transitionDuration=du+'s';s.style.transitionDelay=d+'s';});
  requestAnimationFrame(()=>requestAnimationFrame(()=>spans.forEach(s=>{const r=s.getBoundingClientRect(),rx=Math.random(),ry=Math.random();let tf,fl;
    if(mode==='water'||mode==='wave'){tf=`translate(${(rx-.5)*30}px,${60+ry*110}px) scale(.85)`;fl='blur(5px)';}
    else if(mode==='ink'){tf=`translate(${(rx-.5)*14}px,${(ry-.5)*14}px) scale(${1.5+rx})`;fl='blur(9px)';}
    else if(mode==='silk'){tf=`translate(${180+rx*320}px,${(ry-.6)*140}px) rotate(${20+rx*70}deg)`;fl='blur(2px)';}
    else if(mode==='halo'&&hc){const cx=(hc[0]/aspect)*innerWidth-(r.left+r.width/2),cy=(1-hc[1])*innerHeight-(r.top+r.height/2);
      tf=`translate(${cx*(.8+rx*.2)}px,${cy*(.8+ry*.2)}px) scale(.15) rotate(${(rx-.5)*180}deg)`;fl='blur(3px)';}
    else{tf=`translate(${(rx-.5)*40}px,${-(70+ry*140)}px) scale(1.1)`;fl='blur(7px)';}
    s.style.transform=tf;s.style.filter=fl;s.style.opacity='0';})));
  // and the art answers
  let k=0;const fx=setInterval(()=>{k++;const x=.15+.7*Math.random(),y=.3+.5*Math.random();
    if(mode==='water')addPlop(x,y,.8);else if(mode==='ink'&&inkA)inkDrop(x,y,inkNext++,.7);else if(mode==='wave'&&wvH)wavePoke(x,y,.4);
    else if(mode==='halo'&&halo)haloKick((Math.random()*HN)|0,.4);else if(mode==='silk'){silkWind.x=1.3;silkWind.y=(Math.random()-.5)*.4;}
    else if(mode==='paint'){const a=Math.random()*6.283;queue.push({x,y,vx:Math.cos(a)*.3,vy:Math.sin(a)*.3,set:.6,c:pickColor(k),r:.004,s:.6});}
    if(k>=6)clearInterval(fx);},420);
  setTimeout(done,3300);});}
// ---- the kept ones ----
const MODE_NAME_K={cosmos:'Cosmos',splash:'Splash',paint:'Pigment',water:'Ripple',wave:'Wave',light:'Aurora',silk:'Silk',cloud:'Cloud',ink:'Ink',halo:'Halo'};
const TRASH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 12.2h9l1-12.2M10.2 10.5v5.8M13.8 10.5v5.8"/></svg>';
const MODE_TINT={cosmos:'#1b3fd6',splash:'#f2551a',paint:'#e85d8a',water:'#2fa4c4',wave:'#2b7fd6',light:'#7a5cff',silk:'#d79ad0',cloud:'#9fb6d8',ink:'#3a3a3a',halo:'#e8e4f0'};
async function openKept(){let recs=[];try{recs=await dbDo('readonly',st=>st.getAll());}catch(e){}
  if(!recs||!recs.length){viewRestore();return mToast('아직 간직한 마음이 없어요');}
  const key=await mindUnlock();if(!key){viewRestore();return;}
  for(const r of recs)if(r.img){delete r.img;try{await dbDo('readwrite',st=>st.put(r));}catch(e){}}   // older notes carried a picture: keep only the words now
  const items=[];for(const r of recs.sort((a,b)=>b.id-a.id)){try{items.push({r,d:await openNote(key,r)});}catch(e){}}
  mCard.innerHTML=`<h3>간직한 마음</h3><p>${items.length}개 · 이 휴대폰에만 있어요</p><div class="mlist">${items.map((it,i)=>{const m=it.d.mode||'paint';
      return `<div class="mrow"><button class="mitem" data-i="${i}"><img class="mthumb" alt="" src="thumbs/${MODE_NAME_K[m]?m:'paint'}.jpg"><div><b>${fmtDate(it.d.t)} · ${MODE_NAME_K[m]||m}</b><span></span></div></button><button class="mtrash" aria-label="지우기">${TRASH_SVG}</button></div>`;}).join('')}</div>
    <div class="mbtns"><button class="mbtn" id="mLc">닫기</button></div>`;
  mCard.querySelectorAll('.mitem').forEach((b,i)=>{const it=items[i];b.querySelector('span').textContent=it.d.text.split('\n')[0];
    b.onclick=()=>{mModal.classList.remove('on');viewKept(it,()=>openKept());};
    b.parentNode.querySelector('.mtrash').onclick=async()=>{const ok=await mMenu('이 마음을 지울까요?','지우면 다시 꺼낼 수 없어요',[{t:'지우기',v:1,cls:'danger'},{t:'취소',v:0}]);
      if(ok){try{await dbDo('readwrite',st=>st.delete(it.r.id));}catch(e){}mToast('지웠어요');}openKept();};});
  document.getElementById('mLc').onclick=()=>{mModal.classList.remove('on');viewRestore();};
  mShow(true);}
// reading a kept note: the mode it was written in comes back underneath (with its music), the words over it
let viewPrevMode=null;
function viewRestore(){if(viewPrevMode!=null){if(viewPrevMode!==mode)setMode(viewPrevMode);viewPrevMode=null;}}
function viewKept(it,back){const v=document.getElementById('mView');
  if(viewPrevMode==null)viewPrevMode=mode;
  const m=it.d.mode;if(m&&m!==mode&&MODE_NAME_K[m])setMode(m);
  document.body.classList.add('mview');for(const id of [...pointers.keys()])tUp(id);
  const vT=document.getElementById('vText'),vDel=document.getElementById('vDel'),vShr=document.getElementById('vShare'),vUndo=document.getElementById('vUndo'),vSave=document.getElementById('vSave');
  document.getElementById('vDate').textContent=fmtDate(it.d.t);vT.value=it.d.text;vT.scrollTop=0;
  const cur=()=>vT.value.replace(/\s+$/,''),dirty=()=>cur()!==it.d.text;
  const foot=()=>{const e=dirty();vDel.hidden=vShr.hidden=e;vUndo.hidden=vSave.hidden=!e;};foot();vT.oninput=foot;   // once the words change: 되돌리기 · 간직하기
  vUndo.onclick=()=>{vT.value=it.d.text;foot();try{vT.blur();}catch(e){}};
  const save=async()=>{const text=cur();if(!text.trim()){mToast('비어 있으면 간직할 수 없어요');return false;}
    try{const d={...it.d,text,edited:Date.now()};const n=await sealNote(d);await dbDo('readwrite',st=>st.put({id:it.r.id,...n}));it.d=d;it.r={id:it.r.id,...n};}   // sealed again with the public key: no PIN needed
    catch(e){mToast('간직하지 못했어요');return false;}
    vT.value=text;foot();try{vT.blur();}catch(e){}mToast('고친 마음을 간직했어요');return true;};
  vSave.onclick=save;
  v.classList.add('on');v.setAttribute('aria-hidden','false');
  const close=async(again)=>{if(again){await back();}
    v.classList.remove('on');v.setAttribute('aria-hidden','true');document.body.classList.remove('mview');
    if(again);else if(viewPrevMode!=null){if(viewPrevMode!==mode)setMode(viewPrevMode);viewPrevMode=null;}};
  document.getElementById('vBack').onclick=async()=>{if(dirty()){try{vT.blur();}catch(e){}
      const v2=await mMenu('고친 마음을 간직할까요?','',[{t:'간직하기',v:'keep'},{t:'고치지 않고 닫기',v:'drop'},{t:'계속 고치기',v:'stay'}]);
      if(v2==='stay'){try{vT.focus();}catch(e){}return;}if(v2==='keep'&&!(await save()))return;}
    try{vT.blur();}catch(e){}close(false);};
  document.getElementById('vShot').onclick=async()=>{const text=cur();try{vT.blur();}catch(e){}const art=await grabArt();await mindFont(text);await saveMind(composeMind(art,text,it.d.t));};
  vShr.onclick=()=>{try{vT.blur();}catch(e){}close(true);};   // back to the list of kept notes
document.getElementById('vDel').onclick=async()=>{const ok=await mMenu('이 마음을 지울까요?','지우면 다시 꺼낼 수 없어요',[{t:'지우기',v:1,cls:'danger'},{t:'취소',v:0}]);
    if(!ok)return;try{await dbDo('readwrite',st=>st.delete(it.r.id));}catch(e){}close(false);mToast('지웠어요');
    try{const left=await dbDo('readonly',st=>st.count());if(left)back();}catch(e){}};}
capPress(document.getElementById('penBtn'),openMind);
document.getElementById('pinBtn').onclick=changePin;
// ---- moving the kept notes to another phone: a backup file that stays locked ----
// the file holds the box's lock (salt, the PIN-locked private key, the public key) and every note exactly as sealed:
// nothing in it can be read without the PIN. It never goes to a server — the person carries it (Quick Share, USB, mail…).
const b64e=u=>{u=u instanceof Uint8Array?u:new Uint8Array(u);let t='';for(let i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(t);};
const b64d=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};
// an older Android app (APK) cannot save files to Downloads or open a file picker: say so plainly instead of silently doing nothing
const APK_URL='https://github.com/kyuil71/APK-builder/releases/latest/download/HandFlowArt.apk';
function apkTooOld(){try{return !!window.AndroidSave&&!(typeof AndroidSave.version==='function'&&AndroidSave.version()>=2);}catch(e){return true;}}
async function apkUpdateNote(){const v=await mMenu('새 앱 설치가 필요해요','지금 설치된 Hand Flow Art 앱은 파일 저장·선택 기능이 없는 예전 버전이에요.<br>새 앱을 받아 설치하면 (간직한 글은 그대로) 백업을 쓸 수 있어요.<br><small>'+APK_URL+'</small>',
    [{t:'주소 복사',v:'copy',cls:'solid'},{t:'닫기',v:0}]);
  if(v==='copy'){try{await navigator.clipboard.writeText(APK_URL);mToast('주소를 복사했어요 · 인터넷 브라우저에 붙여 넣어 받으세요');}catch(e){mToast(APK_URL);}}}
async function mindExport(){openMenu(false);if(apkTooOld())return apkUpdateNote();
  let recs=[];try{recs=await dbDo('readonly',st=>st.getAll());}catch(e){}
  if(!mindMeta()||!recs.length)return mToast('아직 간직한 마음이 없어요');
  const K=await mindUnlock();if(!K)return;                                        // the PIN once: proves it is yours, and upgrades any older notes
  await mindMigrate(K.pin);try{recs=await dbDo('readonly',st=>st.getAll());}catch(e){}
  const notes=recs.filter(r=>r.wk).map(r=>({id:r.id,iv:r.iv,ct:b64e(r.ct),wk:b64e(r.wk)}));
  const data={app:'hand-flow-maeum',v:1,exported:Date.now(),count:notes.length,meta:mindMeta(),notes};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),d=new Date(),z=n=>String(n).padStart(2,'0');
  const name=`hand-flow-maeum-backup-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`,file=new File([blob],name,{type:'application/json'});
  const canShare=!window.AndroidSave&&navigator.canShare&&(()=>{try{return navigator.canShare({files:[file]});}catch(e){return false;}})();
  const v=await mMenu(`마음 ${notes.length}개를 백업했어요`,'파일은 비밀번호로 잠겨 있어 이 번호 없이는 아무도 읽을 수 없어요.<br>새 휴대폰으로 옮긴 뒤 메뉴의 \'백업 가져오기\'로 불러오세요.',
    [{t:'휴대폰에 파일로 저장',v:'save',cls:'solid'},...(canShare?[{t:'다른 곳으로 보내기',v:'share'}]:[]),{t:'취소',v:0}]);
  if(v==='share'){try{await navigator.share({files:[file],title:'Hand Flow Art 마음 백업'});}catch(e){if(!(e&&e.name==='AbortError'))mToast('보내지 못했어요');}}
  else if(v==='save'){if(window.AndroidSave){const ok=await saveNative(blob,'json','_maeum-backup').catch(()=>false);if(!ok)mToast('저장하지 못했어요');}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);mToast('다운로드 폴더에 저장했어요');}}}
async function mindImport(file){
  let data;try{data=JSON.parse(await file.text());}catch(e){return mToast('백업 파일을 읽지 못했어요');}
  if(!data||data.app!=='hand-flow-maeum'||!data.meta||!data.meta.pub||!Array.isArray(data.notes))return mToast('Hand Flow Art 마음 백업 파일이 아니에요');
  const pin=await askPin('unlock',{meta:data.meta,title:'백업 파일의 비밀번호',sub:`마음 ${data.notes.length}개 · 이 백업을 만들 때 쓰던 번호를 입력해 주세요`});if(!pin)return;
  let bpriv;try{const pk=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(data.meta.piv)},pin,new Uint8Array(data.meta.pct));bpriv=await crypto.subtle.importKey('pkcs8',pk,RSA,true,['decrypt']);}
  catch(e){return mToast('백업 파일이 손상됐어요');}
  let have=[];try{have=await dbDo('readonly',st=>st.getAllKeys());}catch(e){}const haveS=new Set(have);
  const fresh=!mindMeta();if(fresh){localStorage.setItem(MIND_META,JSON.stringify(data.meta));mindKey={pin,priv:bpriv};}   // a new phone takes the backup's lock as is (same PIN)
  let added=0,skip=0,bad=0;
  for(const n of data.notes){if(haveS.has(n.id)){skip++;continue;}
    try{const r={iv:n.iv,ct:b64d(n.ct),wk:b64d(n.wk)};
      if(fresh){await openNote({priv:bpriv,pin},r);await dbDo('readwrite',st=>st.put({id:n.id,...r}));}   // check it opens, then keep it exactly as sealed
      else{const d=await openNote({priv:bpriv,pin},r);const s2=await sealNote(d);await dbDo('readwrite',st=>st.put({id:n.id,...s2}));}   // sealed again with this phone's lock
      added++;}catch(e){bad++;}}
  const msg=`마음 ${added}개를 가져왔어요`+(skip?` · ${skip}개는 이미 있어 건너뜀`:'')+(bad?` · ${bad}개는 열지 못함`:'');
  const v=await mMenu(msg,fresh?'비밀번호는 백업을 만들 때와 같아요':'이 휴대폰의 비밀번호로 다시 잠가 두었어요',[{t:'리스트 보기',v:'list',cls:'solid'},{t:'닫기',v:0}]);
  if(v==='list')openKept();}
document.getElementById('bakOut').onclick=()=>mindExport();
document.getElementById('bakIn').onclick=()=>{openMenu(false);if(apkTooOld())return apkUpdateNote();const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.style.display='none';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.remove();if(f)mindImport(f);};document.body.appendChild(inp);inp.click();};

capPress(document.getElementById('bookBtn'),()=>{openMenu(false);openKept();});

addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;inst.style.display='block';});
inst.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;inst.style.display='none';};
if('serviceWorker' in navigator && location.protocol!=='file:'){
  // 새 버전이 설치되어 화면을 넘겨받으면 한 번 자동 새로고침 (첫 설치 때는 제외)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded&&!camOn){reloaded=true;location.reload();}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
    navigator.serviceWorker.ready.then(()=>{ if(!camOn&&statusEl.textContent.startsWith('손 인식 꺼짐'))status('손 인식 꺼짐 · 오프라인 저장 완료'); });
  }).catch(e=>console.warn('SW',e)));
}

addEventListener('orientationchange',()=>resize());try{screen.orientation&&screen.orientation.addEventListener('change',()=>resize());}catch(e){}
function lockOrientation(){try{const o=screen.orientation;if(o&&o.lock)o.lock('portrait').catch(()=>{});}catch(e){}}
lockOrientation();

document.addEventListener('fullscreenchange',lockOrientation);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockOrientation();});
