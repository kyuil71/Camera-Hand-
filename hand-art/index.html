<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hand Flow Art</title>
<meta name="theme-color" content="#0a1222">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0a1222;--glass:rgba(12,20,38,.62);--line:rgba(255,255,255,.14);--ink:#f4efe4;--mute:rgba(244,239,228,.66);--accent:#f7c844}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#art,canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
.bar{display:block;width:56px;height:5px;border-radius:3px;background:rgba(190,196,206,.55);transition:background .35s,box-shadow .35s}
body.detect .bar{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.95)}
#grab{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(env(safe-area-inset-bottom) + 64px);display:flex;justify-content:center;padding-top:30px;touch-action:none;transition:opacity .3s}
body.menu #grab{opacity:0;pointer-events:none}
.head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 12px;touch-action:none}
#status{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:center}
#status:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(190,196,206,.6);flex:0 0 auto}
body.detect #status:before{background:#fff;box-shadow:0 0 8px #fff}
.dock{position:fixed;left:50%;bottom:0;z-index:6;transform:translate(-50%,calc(100% + 24px));width:100%;max-width:430px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.menu .dock{transform:translate(-50%,0)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:8px}
.row+.row{margin-top:10px}
.chips{overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;padding:8px 12px 8px 8px;font:inherit;font-size:16px}
.chip i{display:flex;width:44px;height:18px;border-radius:9px;overflow:hidden}
.chip i span{flex:1}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(247,200,68,.14)}
.btn{flex:1;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;font-weight:600}
.btn.main{flex:1.6;background:var(--ink);color:#101826;border-color:transparent}
.btn.main.on{background:#d8262c;color:#fff}
.btn:active,.chip:active{transform:scale(.97)}
#install{display:none}
.speed{display:flex;align-items:center;gap:12px;margin:0 2px 12px;touch-action:none}
.speed span{font-size:16px;color:var(--mute);flex:0 0 auto}
.speed b{font-size:16px;font-weight:600;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#speed{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;touch-action:none}
#speed::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
#speed::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.hint{font-size:16px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="video" playsinline muted style="display:none"></video>

<div id="grab" aria-label="메뉴 열기"><span class="bar"></span></div>

<div class="dock" id="sheet">
  <div class="panel">
    <div class="head" id="sheetHead"><span class="bar"></span><div id="status">손 인식 꺼짐 · 화면을 문질러 보세요</div></div>
    <div class="speed"><span>흐름 속도</span><input type="range" id="speed" min="0" max="100" step="1"><b id="speedVal"></b></div>
    <div class="row chips" id="palettes"></div>
    <div class="row">
      <button class="btn main" id="camBtn">손 인식 시작</button>
      <button class="btn" id="seedBtn">새 캔버스</button>
      <button class="btn" id="snapBtn">저장</button>
    </div>
    <div class="row">
      <button class="btn" id="fsBtn">전체화면</button>
      <button class="btn" id="install">앱 설치</button>
    </div>
    <p class="hint"><b>손가락</b> 흐름 그리기 · <b>검지만 펴기</b> 방향 분사<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 굳히기</p>
  </div>
</div>

<script src="mediapipe/hands.js"></script>
<script>
'use strict';
/* ================= Palettes ================= */
const PALETTES = {
  '아나돌':  ['#0050ff','#00c8ff','#ff5a00','#ffd000','#ff1745','#f2fbff'],
  '심해':    ['#0018a8','#0070ff','#00d5ff','#00ffc8','#7a3cff','#ffffff'],
  '용암':    ['#c4001a','#ff2a00','#ff7a00','#ffc400','#ff0066','#ffe86b'],
  '오로라':  ['#00e08a','#00f5ff','#6b2bff','#ff00c8','#ffe600','#0066ff'],
  '모노':    ['#111418','#3b4048','#8a919c','#d6d9de','#f4f2ec','#5e6570']
};
let paletteName = '아나돌';
const hex2rgb = h => [1,3,5].map(i => parseInt(h.substr(i,2),16)/255);
const pal = () => PALETTES[paletteName].map(hex2rgb);
let palFlat = new Float32Array(pal().flat());

/* ================= WebGL2 setup ================= */
const canvas = document.getElementById('art');
const gl = canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
if(!gl){ document.getElementById('status').textContent='이 기기는 WebGL2를 지원하지 않습니다'; throw new Error('no webgl2'); }
const canRenderFloat = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const IFMT = canRenderFloat ? gl.RGBA16F : gl.RGBA8;
const TYPE = canRenderFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

const VS = `#version 300 es
precision highp float;
in vec2 aPos; uniform vec2 texel;
out vec2 vUv,vL,vR,vT,vB;
void main(){vUv=aPos*.5+.5;vL=vUv-vec2(texel.x,0.);vR=vUv+vec2(texel.x,0.);vT=vUv+vec2(0.,texel.y);vB=vUv-vec2(0.,texel.y);gl_Position=vec4(aPos,0.,1.);}`;
const H = `#version 300 es
precision highp float;precision highp sampler2D;
in vec2 vUv,vL,vR,vT,vB;out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float bristle(vec2 uv,vec2 dims,float sd){vec2 q=uv*dims;return .55*vn(q/2.2+sd)+.3*vn(q/5.+sd*1.7)+.15*vn(q/11.-sd);}
`;
const FS = {
splatVelSet: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float w=clamp(exp(-dot(p,p)/radius)*strength,0.,1.);vec2 b=texture(uT,vUv).xy;o=vec4(mix(b,color.xy,w),0.,1.);}`,
splatVel: H+`uniform sampler2D uT;uniform float aspect,radius;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uT,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
splatDye: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec4 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float g=exp(-dot(p,p)/radius);
float w=clamp(smoothstep(.06,.5,g)*strength,0.,1.);vec4 b=texture(uT,vUv);
o=vec4(mix(b.rgb,color.rgb,w),min(b.a+(w*.7+g*.6)*color.a*strength,3.2));}`,
maccormack: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel,srcTexel;uniform float dt;uniform vec4 diss;
void main(){vec2 v=texture(uVel,vUv).xy*simTexel*dt;vec2 c=vUv-v;vec4 fwd=texture(uSrc,c);
vec2 xf=vUv+v;vec2 vf=texture(uVel,xf).xy*simTexel*dt;vec4 back=texture(uSrc,xf-vf);
vec4 r=fwd+.5*(texture(uSrc,vUv)-back);
vec2 b=(floor(c/srcTexel-.5)+.5)*srcTexel;
vec4 a1=texture(uSrc,b),a2=texture(uSrc,b+vec2(srcTexel.x,0.)),a3=texture(uSrc,b+vec2(0.,srcTexel.y)),a4=texture(uSrc,b+srcTexel);
r=clamp(r,min(min(a1,a2),min(a3,a4)),max(max(a1,a2),max(a3,a4)));
o=r/(1.+diss*dt);}`,
detail: H+`uniform sampler2D uT;uniform vec2 dims;uniform float rate,sd;
void main(){float n=bristle(vUv,dims,sd);o=vec4(mix(rate<1.?texture(uT,vUv).x:n,n,min(rate,1.)),0.,0.,1.);}`,
advect: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel;uniform float dt;uniform vec4 diss;
void main(){vec2 c=vUv-dt*texture(uVel,vUv).xy*simTexel;o=texture(uSrc,c)/(1.+diss*dt);}`,
divergence: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).x,R=texture(uVel,vR).x,T=texture(uVel,vT).y,B=texture(uVel,vB).y;vec2 C=texture(uVel,vUv).xy;
if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
curl: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).y,R=texture(uVel,vR).y,T=texture(uVel,vT).x,B=texture(uVel,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
vorticity: H+`uniform sampler2D uVel,uCurl;uniform float curl,dt;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;
vec2 v=texture(uVel,vUv).xy+f*dt;o=vec4(clamp(v,-1000.,1000.),0.,1.);}`,
pressure: H+`uniform sampler2D uP,uDiv;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;o=vec4((L+R+T+B-texture(uDiv,vUv).x)*.25,0.,0.,1.);}`,
gradient: H+`uniform sampler2D uP,uVel;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;vec2 v=texture(uVel,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`,
scale: H+`uniform sampler2D uT;uniform float value;void main(){o=value*texture(uT,vUv);}`,
ambient: H+`uniform sampler2D uVel;uniform float t,amp,dt;
vec2 swirl(vec2 u,vec2 c,float r,float s){vec2 d=u-c;return vec2(-d.y,d.x)*exp(-dot(d,d)/r)*s;}
void main(){vec2 u=vUv;
vec2 f=vec2(sin(u.y*2.3+t*.31)+.5*sin(u.y*5.1+u.x*2.2-t*.58)+.16*sin(u.y*11.+u.x*3.-t*1.05),
            cos(u.x*2.0-t*.27)+.5*cos(u.x*4.7-u.y*2.4+t*.49)+.16*cos(u.x*10.-u.y*4.+t*.88));
f+=swirl(u,vec2(.5+.32*sin(t*.11),.5+.3*cos(t*.14)),.07,26.);
f-=swirl(u,vec2(.5+.3*cos(t*.09+2.),.5+.34*sin(t*.12+1.)),.05,30.);
f+=swirl(u,vec2(.5+.25*sin(t*.17+4.),.5+.25*sin(t*.07+3.)),.02,40.);
o=vec4(texture(uVel,vUv).xy+f*amp*dt,0.,1.);}`,
init: H+`uniform vec3 pal[6];uniform float seed,aspect;
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
void main(){vec2 p=vUv*vec2(aspect,1.)*1.25+seed;float n=fbm(p);float m=fbm(p*1.7+n*3.+seed*.3);
float k=fract(n*1.9+m*1.3)*6.;int i=int(k);vec3 c=mix(pal[i],pal[(i+1)%6],smoothstep(.55,1.,fract(k)));
o=vec4(c,.4+1.6*m*m+.4*sin(k*3.14));}`,
display: H+`uniform sampler2D uDye,uDet;uniform vec3 pal[6];uniform vec2 dyeTexel;uniform float dotSize,relief,time;
float Hh(vec2 uv){vec4 d=texture(uDye,uv);float t=texture(uDet,uv).x;
return d.a*.78+dot(d.rgb,vec3(.3,.5,.2))*.22+(t-.5)*(.12+.1*d.a);}
vec2 grd(vec2 uv,vec2 e){return vec2(Hh(uv-vec2(e.x,0.))-Hh(uv+vec2(e.x,0.)),Hh(uv-vec2(0.,e.y))-Hh(uv+vec2(0.,e.y)));}
void main(){vec4 d=texture(uDye,vUv);float t=texture(uDet,vUv).x;
vec2 g=grd(vUv,dyeTexel*1.2)*.42+grd(vUv,dyeTexel*4.)*.5+grd(vUv,dyeTexel*11.)*.45;
vec3 n=normalize(vec3(g*relief,1.));
vec3 L=normalize(vec3(-.42,.62,.66));vec3 Hv=normalize(L+vec3(0.,0.,1.));
float diff=max(dot(n,L),0.);
float nh=max(dot(n,Hv),0.);float spec=pow(nh,70.)*1.05+pow(nh,12.)*.16;
float fres=pow(1.-n.z,2.);
float hC=Hh(vUv),hW=0.;for(int i=0;i<4;i++){float a=float(i)*1.5708+.6;hW+=Hh(vUv+vec2(cos(a),sin(a))*dyeTexel*9.);}hW*=.25;
float ao=clamp(1.-(hW-hC)*1.8,.4,1.12);
float lum=dot(d.rgb,vec3(.3,.55,.15));
vec3 nc=pal[0];float nd=1e3;for(int i=0;i<6;i++){vec3 q=d.rgb-pal[i];float dd=dot(q,q);if(dd<nd){nd=dd;nc=pal[i];}}
vec3 base=mix(d.rgb,nc,.55);base=max(mix(vec3(dot(base,vec3(.3,.55,.15))),base,1.4),0.);
base*=.9+.2*t;
vec3 c=base*(.28+.9*diff)*ao+spec*vec3(1.,.97,.92)*(.6+.4*min(d.a,1.5))+fres*base*.35;
vec2 q=gl_FragCoord.xy/dotSize;vec2 id=floor(q);vec2 f=fract(q)-.5;float h1=hash(id);
f+=(vec2(h1,hash(id+7.31))-.5)*.45;
float br=clamp(dot(c,vec3(.33)),0.,1.);float r=.36+.16*br+.06*h1;
float dm=1.-smoothstep(r-.17,r,length(f));
c=mix(c*.8,c*(1.03+.1*h1),dm);
c+=step(.988,hash(id+floor(time*4.)))*spec*.7;
c+=(hash(gl_FragCoord.xy+fract(time)*91.)-.5)*.025;
c=1.-exp(-c*1.6);c=clamp(mix(vec3(dot(c,vec3(.3,.55,.15))),c,1.18),0.,1.);o=vec4(c,1.);}`
};

function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const vs = compile(gl.VERTEX_SHADER,VS);
const P = {};
for(const k in FS){const p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,compile(gl.FRAGMENT_SHADER,FS[k]));
  gl.bindAttribLocation(p,0,'aPos');gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name.replace('[0]','');u[nm]=gl.getUniformLocation(p,nm);}
  P[k]={p,u};}

const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);

function fbo(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,IFMT,w,h,0,gl.RGBA,TYPE,null);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.viewport(0,0,w,h);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  return {t,f,w,h,tx:1/w,ty:1/h,bind(u){gl.activeTexture(gl.TEXTURE0+u);gl.bindTexture(gl.TEXTURE_2D,t);return u;}};}
function dfbo(w,h){return {r:fbo(w,h),w:fbo(w,h),swap(){const x=this.r;this.r=this.w;this.w=x;}};}
function blit(target){if(target){gl.bindFramebuffer(gl.FRAMEBUFFER,target.f);gl.viewport(0,0,target.w,target.h);}
  else{gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);}
  gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);}
function use(k,texel){const s=P[k];gl.useProgram(s.p);gl.uniform2f(s.u.texel,texel[0],texel[1]);return s.u;}

/* ================= Simulation state ================= */
const SIM_RES=128, DYE_RES=640;
let vel,dye,det,detSeed=0,div,curlF,pres,aspect=1,dpr=1;
function res(r){let a=canvas.width/canvas.height;if(a<1)a=1/a;const mn=Math.round(r),mx=Math.round(r*a);
  return canvas.width>canvas.height?[mx,mn]:[mn,mx];}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
  if(canvas.width===w&&canvas.height===h&&vel)return;
  canvas.width=w;canvas.height=h;fx.width=w;fx.height=h;aspect=w/h;
  const [sw,sh]=res(SIM_RES),[dw,dh]=res(DYE_RES);
  vel=dfbo(sw,sh);dye=dfbo(dw,dh);det=dfbo(dw,dh);div=fbo(sw,sh);curlF=fbo(sw,sh);pres=dfbo(sw,sh);
  seed();}
function seed(){const u=use('init',[dye.w.tx,dye.w.ty]);
  gl.uniform3fv(u.pal,palFlat);gl.uniform1f(u.seed,Math.random()*100);gl.uniform1f(u.aspect,aspect);
  blit(dye.w);dye.swap();
  detSeed=Math.random()*50;detailPass(2);
  for(let i=0;i<14;i++)splatVel(Math.random(),Math.random(),(Math.random()-.5)*900,(Math.random()-.5)*900,.012);}

function splatVelSet(x,y,vx,vy,r,k){const u=use('splatVelSet',[vel.r.tx,vel.r.ty]);
  gl.uniform1i(u.uT,vel.r.bind(0));gl.uniform1f(u.aspect,aspect);gl.uniform2f(u.point,x,y);
  gl.uniform3f(u.color,vx,vy,0);gl.uniform1f(u.radius,r*(aspect>1?aspect:1));gl.uniform1f(u.strength,k);blit(vel.w);vel.swap();}
function splatVel(x,y,dx,dy,r){const u=use('splatVel',[vel.r.tx,vel.r.ty]);
  gl.uniform1i(u.uT,vel.r.bind(0));gl.uniform1f(u.aspect,aspect);gl.uniform2f(u.point,x,y);
  gl.uniform3f(u.color,dx,dy,0);gl.uniform1f(u.radius,(r||.003)*(aspect>1?aspect:1));blit(vel.w);vel.swap();}
function splatDye(x,y,c,r,strength,thick){const u=use('splatDye',[dye.r.tx,dye.r.ty]);
  gl.uniform1i(u.uT,dye.r.bind(0));gl.uniform1f(u.aspect,aspect);gl.uniform2f(u.point,x,y);
  gl.uniform4f(u.color,c[0],c[1],c[2],thick==null?.6:thick);gl.uniform1f(u.radius,(r||.002)*(aspect>1?aspect:1));gl.uniform1f(u.strength,strength==null?1:strength);
  blit(dye.w);dye.swap();}

function detailPass(rate){const u=use('detail',[det.r.tx,det.r.ty]);gl.uniform1i(u.uT,det.r.bind(0));
  gl.uniform2f(u.dims,det.r.w,det.r.h);gl.uniform1f(u.rate,rate);gl.uniform1f(u.sd,detSeed);blit(det.w);det.swap();}
let flow=1, flowTarget=1, simTime=0;
// base flow speed: slider 0..100 → 0.04..2.0 (log); 1.0 = previous speed
const sliderToSpeed=v=>.04*Math.pow(50,v/100);
let speedVal=25; try{const v=parseFloat(localStorage.getItem('hf-speed'));if(!isNaN(v))speedVal=v;}catch(e){}
let speed=sliderToSpeed(speedVal);
// finger → fluid: uv/sec → sim texels/sec, plus a little extra when the base is set faster
// global time scale = slider base + boost from how fast the fingers are moving right now
let handAct=0, timeScale=speed;
function feelFinger(v){ if(v>handAct)handAct=v; }      // v = fingertip speed in screen-heights/sec
function updateTimeScale(dt){
  handAct*=Math.exp(-dt*2.2);                            // fingers slow/stop → boost fades
  const boost=Math.min(handAct*1.25,4);
  const target=Math.min(speed+boost*(.35+.5*Math.min(speed,2)),4);
  timeScale+=(target-timeScale)*Math.min(1,dt*(target>timeScale?5:1.1));   // quick to speed up, gentle to calm down
}
function step(dt){
  const tx=[vel.r.tx,vel.r.ty];
  let u=use('ambient',tx);gl.uniform1i(u.uVel,vel.r.bind(0));gl.uniform1f(u.t,simTime);gl.uniform1f(u.amp,34);gl.uniform1f(u.dt,dt);blit(vel.w);vel.swap();
  u=use('curl',tx);gl.uniform1i(u.uVel,vel.r.bind(0));blit(curlF);
  u=use('vorticity',tx);gl.uniform1i(u.uVel,vel.r.bind(0));gl.uniform1i(u.uCurl,curlF.bind(1));gl.uniform1f(u.curl,15);gl.uniform1f(u.dt,dt);blit(vel.w);vel.swap();
  u=use('divergence',tx);gl.uniform1i(u.uVel,vel.r.bind(0));blit(div);
  u=use('scale',tx);gl.uniform1i(u.uT,pres.r.bind(0));gl.uniform1f(u.value,.8);blit(pres.w);pres.swap();
  u=use('pressure',tx);gl.uniform1i(u.uDiv,div.bind(1));
  for(let i=0;i<22;i++){gl.uniform1i(u.uP,pres.r.bind(0));blit(pres.w);pres.swap();}
  u=use('gradient',tx);gl.uniform1i(u.uP,pres.r.bind(0));gl.uniform1i(u.uVel,vel.r.bind(1));blit(vel.w);vel.swap();
  u=use('advect',tx);gl.uniform2f(u.simTexel,vel.r.tx,vel.r.ty);gl.uniform1f(u.dt,dt);
  gl.uniform1i(u.uVel,vel.r.bind(0));gl.uniform1i(u.uSrc,vel.r.bind(0));gl.uniform4f(u.diss,.2,.2,0,0);blit(vel.w);vel.swap();
  u=use('maccormack',[dye.r.tx,dye.r.ty]);gl.uniform2f(u.simTexel,vel.r.tx,vel.r.ty);gl.uniform2f(u.srcTexel,dye.r.tx,dye.r.ty);gl.uniform1f(u.dt,dt);
  gl.uniform1i(u.uVel,vel.r.bind(0));gl.uniform1i(u.uSrc,dye.r.bind(1));gl.uniform4f(u.diss,.003,.003,.003,.03);blit(dye.w);dye.swap();
  gl.uniform2f(u.srcTexel,det.r.tx,det.r.ty);gl.uniform1i(u.uSrc,det.r.bind(1));gl.uniform4f(u.diss,0,0,0,0);blit(det.w);det.swap();
  detailPass(.006);
}

/* ================= Interaction (touch + hands) ================= */
const fx=document.getElementById('fx');const fxc=fx.getContext('2d');
const queue=[];           // deferred GPU splats
let ambientClock=0, colorTick=0;
const pickColor=(i)=>{const p=pal();const c=p[(i+colorTick)%p.length];const k=.9+Math.random()*.25;return c.map(v=>Math.min(1,v*k));};

// touch fallback
const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{if(document.body.classList.contains('menu')){openMenu(false);return;}pointers.set(e.pointerId,{x:e.clientX/innerWidth,y:1-e.clientY/innerHeight,t:e.timeStamp,c:pickColor(pointers.size+(Math.random()*6|0))});wake();});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;
  const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;const dtR=Math.min(Math.max((e.timeStamp-p.t)/1000,.008),.1);feelFinger(Math.hypot((x-p.x)*aspect,y-p.y)/dtR);
  queue.push({x,y,vx:(x-p.x)/dtR,vy:(y-p.y)/dtR,set:.85,c:p.c,r:.0032,s:.9});p.x=x;p.y=y;p.t=e.timeStamp;});
['pointerup','pointercancel','pointerleave'].forEach(t=>canvas.addEventListener(t,e=>pointers.delete(e.pointerId)));

// hand state
const TIPS=[4,8,12,16,20];
const tracks={};            // key `${hand}-${tip}` -> {x,y}
let hands=null, handsReady=false, camOn=false, busy=false, lastSeen=0, fistSince=0, handInfo=[];
const pinchState={}, pointState={};
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function onHands(res){
  const now=performance.now();
  const list=res.multiHandLandmarks||[];
  if(!list.length){ if(now-lastSeen>250){for(const k in tracks)delete tracks[k];for(const k in pointState)delete pointState[k];} handInfo=[]; setDetect(false); if(camOn)status('손 인식 켜짐 · 손을 카메라에 보여주세요'); fistSince=0; return; }
  lastSeen=now; handInfo=[]; setDetect(true);
  let anyFist=false;
  list.forEach((lm,h)=>{
    const size=d2(lm[0],lm[9])||.1;
    const fist=[8,12,16,20].every(i=>d2(lm[i],lm[0])<size*1.15);
    const pinch=!fist && d2(lm[4],lm[8])<size*.38;
    const pointing=!fist && !pinch && d2(lm[8],lm[0])>size*1.5 && [12,16,20].every(i=>d2(lm[i],lm[0])<size*1.25);
    let point=null;
    if(pointing){
      let dx=(lm[8].x-lm[5].x)*aspect, dy=-(lm[8].y-lm[5].y); const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
      const ps=pointState[h]; if(ps){dx=ps.dx+(dx-ps.dx)*.45;dy=ps.dy+(dy-ps.dy)*.45;const l2=Math.hypot(dx,dy)||1;dx/=l2;dy/=l2;}
      point={x:lm[8].x,y:1-lm[8].y,dx,dy,c:pointState[h]?.c??((Math.random()*6)|0)};
      pointState[h]=point;
    } else delete pointState[h];
    anyFist=anyFist||fist;
    const pts=[];
    TIPS.forEach((ti,j)=>{
      const raw={x:lm[ti].x, y:1-lm[ti].y};       // selfieMode=true already mirrors
      const key=h+'-'+ti; const prev=tracks[key];
      const sm=prev?{x:prev.x+(raw.x-prev.x)*.6,y:prev.y+(raw.y-prev.y)*.6,t:now}:{...raw,t:now};
      tracks[key]=sm; pts.push(sm);
      if(!prev||fist||(pointing&&ti!==8))return;
      let dx=sm.x-prev.x, dy=sm.y-prev.y; const sp=Math.hypot(dx,dy);
      if(sp>.25)return;                               // tracking jump
      const isIndex=ti===8, strong=isIndex?1:.55;
      const dtR=Math.min(Math.max((now-prev.t)/1000,.016),.12);
      feelFinger(Math.hypot(dx*aspect,dy)/dtR*(isIndex?1:.8));
      queue.push({x:sm.x,y:sm.y,vx:dx/dtR,vy:dy/dtR,set:isIndex?.85:.45,c:pickColor(j+h*2),r:isIndex?.0034:.0019,s:Math.min(1,.12+sp*40)*strong,t:isIndex?.7:.4});
    });
    // pinch → vortex around pinch point
    const pk='p'+h, mid={x:(lm[4].x+lm[8].x)/2,y:1-(lm[4].y+lm[8].y)/2};
    if(pinch){
      if(!pinchState[pk]){ // burst on pinch start
        colorTick++;
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2;queue.push({x:mid.x+Math.cos(a)*.02,y:mid.y+Math.sin(a)*.02,dx:Math.cos(a)*900,dy:Math.sin(a)*900,c:pickColor(i),r:.0024,s:1,t:.9});}
      }
      const dir=(h===0?1:-1);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2+now*.002;const R=.07;
        queue.push({x:mid.x+Math.cos(a)*R,y:mid.y+Math.sin(a)*R*aspect,dx:-Math.sin(a)*(250+500*Math.min(speed,2))*dir,dy:Math.cos(a)*(250+500*Math.min(speed,2))*dir,r:.0045,vOnly:true});}
    }
    pinchState[pk]=pinch;
    handInfo.push({pts,fist,pinch,mid,point});
  });
  if(anyFist){ if(!fistSince)fistSince=now; } else fistSince=0;
  flowTarget = (fistSince && now-fistSince>160) ? 0 : 1;
  status(`카메라 인식됨 · 손 ${list.length}개${flowTarget?'':' · 굳힘'}${handInfo.some(x=>x.point)?' · 가리키기':''}`);
}

/* ================= Camera + embedded AI ================= */
const video=document.getElementById('video');
const setDetect=on=>document.body.classList.toggle('detect',!!on);
const statusEl=document.getElementById('status');const status=t=>{if(t)statusEl.textContent=t;};
const camBtn=document.getElementById('camBtn');
let stream=null, wakeLock=null;

async function startCam(){
  try{
    status('AI 모델 불러오는 중…');camBtn.disabled=true;
    if(!hands){
      hands=new Hands({locateFile:f=>'mediapipe/'+f});
      hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5,selfieMode:true});
      hands.onResults(onHands);
      await hands.initialize();
    }
    status('카메라 여는 중…');
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}});
    video.srcObject=stream;await video.play();
    camOn=true;camBtn.textContent='손 인식 끄기';camBtn.classList.add('on');
    status('손 인식 켜짐 · 손을 카메라에 보여주세요');
    try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}
    detectLoop();
  }catch(err){console.error(err);status(err.name==='NotAllowedError'?'카메라 권한이 거부되었어요':'시작 실패: '+(err.message||err));}
  finally{camBtn.disabled=false;}
}
function stopCam(){camOn=false;stream&&stream.getTracks().forEach(t=>t.stop());stream=null;setDetect(false);
  camBtn.textContent='손 인식 시작';camBtn.classList.remove('on');handInfo=[];flowTarget=1;fistSince=0;for(const k in tracks)delete tracks[k];
  try{wakeLock&&wakeLock.release();}catch(e){} status('손 인식 꺼짐 · 화면을 문질러 보세요');}
async function detectLoop(){
  if(!camOn)return;
  if(!busy&&video.readyState>=2){busy=true;try{await hands.send({image:video});}catch(e){console.warn(e);}busy=false;}
  requestAnimationFrame(detectLoop);
}
camBtn.onclick=()=>camOn?stopCam():startCam();
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&camOn){try{wakeLock=await navigator.wakeLock?.request('screen');}catch(e){}}});

/* fingertip glow overlay */
function drawFx(){
  fxc.clearRect(0,0,fx.width,fx.height);
  if(!handInfo.length)return;
  fxc.lineWidth=1.5*dpr;
  for(const h of handInfo){
    h.pts.forEach((p,i)=>{const x=p.x*fx.width,y=(1-p.y)*fx.height;const r=(i===1?11:7)*dpr*(h.fist?.7:1);
      fxc.strokeStyle=h.fist?'rgba(255,255,255,.35)':'rgba(255,248,230,.75)';fxc.beginPath();fxc.arc(x,y,r,0,7);fxc.stroke();});
    if(h.point){const p=h.point,x=p.x*fx.width,y=(1-p.y)*fx.height,L=46*dpr,ex=x+p.dx*L,ey=y-p.dy*L,a=Math.atan2(-p.dy,p.dx);
      fxc.strokeStyle='rgba(255,248,230,.85)';fxc.lineWidth=2*dpr;fxc.beginPath();fxc.moveTo(x,y);fxc.lineTo(ex,ey);
      fxc.moveTo(ex,ey);fxc.lineTo(ex-Math.cos(a-.5)*12*dpr,ey-Math.sin(a-.5)*12*dpr);fxc.moveTo(ex,ey);fxc.lineTo(ex-Math.cos(a+.5)*12*dpr,ey-Math.sin(a+.5)*12*dpr);fxc.stroke();fxc.lineWidth=1.5*dpr;}
    if(h.pinch){fxc.strokeStyle='rgba(247,200,68,.8)';fxc.beginPath();fxc.arc(h.mid.x*fx.width,(1-h.mid.y)*fx.height,26*dpr,0,7);fxc.stroke();}
  }
}

/* ================= Main loop ================= */
let last=performance.now(), snapReq=false;
function frame(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  resize();
  flow+=(flowTarget-flow)*Math.min(1,dt*(flowTarget>flow?2.5:6));
  // ambient life: drifting color drops keep the canvas evolving
  updateTimeScale(dt);
  ambientClock+=dt*flow*Math.max(timeScale,.15);
  if(ambientClock>.6){ambientClock=0;const x=Math.random(),y=Math.random(),a=Math.random()*6.28;
    const big=Math.random()<.3, r=big?.012+Math.random()*.022:.0014+Math.random()*.0035;
    splatDye(x,y,pickColor(Math.random()*6|0),r,big?.85:.75,big?1.1:.8);
    splatVel(x,y,Math.cos(a)*(big?650:380),Math.sin(a)*(big?650:380),big?r*1.4:.004);}
  if(Math.random()<dt*.15)colorTick++;
  // pointing jets: paint streams out of the fingertip in the pointed direction
  for(const h of handInfo){const p=h.point;if(!p)continue;
    const js=1/Math.max(timeScale,.35);
    if(flow>.3){splatVel(p.x,p.y,p.dx*1500*js*dt*60*.5,p.dy*1500*js*dt*60*.5,.0032);
      for(let k=1;k<=3;k++)splatVel(p.x+p.dx/aspect*.04*k,p.y+p.dy*.04*k,p.dx*(1250-k*180)*js*dt*30,p.dy*(1250-k*180)*js*dt*30,.0042);}
    splatDye(p.x,p.y,pickColor(p.c),.0024,.45,.55);}
  // apply queued splats
  for(const s of queue.splice(0)){
    if(flow>.3){ if(s.set) {const g=1.1/Math.max(timeScale,.35);splatVelSet(s.x,s.y,s.vx*vel.r.w*g,s.vy*vel.r.h*g,s.r*1.25,s.set);}
                 else splatVel(s.x,s.y,s.dx*flow,s.dy*flow,s.r*1.2); }
    if(!s.vOnly)splatDye(s.x,s.y,s.c,s.r,s.s,s.t);
  }
  if(flow>.02){simTime+=dt*flow*timeScale;step(dt*flow*timeScale);}
  // display
  const u=use('display',[0,0]);gl.uniform3fv(u.pal,palFlat);gl.uniform1i(u.uDye,dye.r.bind(0));gl.uniform1i(u.uDet,det.r.bind(1));gl.uniform2f(u.dyeTexel,dye.r.tx,dye.r.ty);
  gl.uniform1f(u.dotSize,2.0*dpr);gl.uniform1f(u.relief,11.+7.*(1.-flow));gl.uniform1f(u.time,now*.001);blit(null);
  if(snapReq){snapReq=false;canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='hand-flow-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');}
  requestAnimationFrame(frame);
}

/* ================= UI ================= */
const palWrap=document.getElementById('palettes');
function renderPalettes(){palWrap.innerHTML='';for(const name in PALETTES){const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===paletteName);b.innerHTML='<i>'+PALETTES[name].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{paletteName=name;palFlat=new Float32Array(pal().flat());renderPalettes();for(let i=0;i<10;i++)queue.push({x:Math.random(),y:Math.random(),dx:0,dy:0,c:pickColor(i),r:.006,s:.9,t:.6});};
  palWrap.appendChild(b);}}
renderPalettes();
const speedEl=document.getElementById('speed'),speedTxt=document.getElementById('speedVal');
const speedLabel=v=>v<30?'아주 느림':v<45?'느림':v<60?'보통':v<80?'빠름':'아주 빠름';
function applySpeed(v){speedVal=+v;speed=sliderToSpeed(speedVal);if(handAct<.05)timeScale=speed;speedTxt.textContent=speedLabel(speedVal);try{localStorage.setItem('hf-speed',speedVal);}catch(e){}}
speedEl.value=speedVal;applySpeed(speedVal);speedEl.addEventListener('input',e=>applySpeed(e.target.value));
document.getElementById('seedBtn').onclick=()=>seed();
document.getElementById('snapBtn').onclick=()=>{snapReq=true;};
document.getElementById('fsBtn').onclick=()=>{const d=document.documentElement;
  if(document.fullscreenElement)document.exitFullscreen();else (d.requestFullscreen||d.webkitRequestFullscreen)?.call(d);};
let hideTimer=0;
function wake(){}
const openMenu=v=>document.body.classList.toggle('menu',v);
function swipe(el,dir,fn){let y0=null;
  el.addEventListener('pointerdown',e=>{y0=e.clientY;el.setPointerCapture?.(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(y0==null)return;if((y0-e.clientY)*dir>28){y0=null;fn();}});
  el.addEventListener('pointerup',e=>{if(y0!=null&&Math.abs(y0-e.clientY)<8)fn();y0=null;});
  el.addEventListener('pointercancel',()=>y0=null);}
swipe(document.getElementById('grab'),1,()=>openMenu(true));          // swipe up (or tap) on the bar
swipe(document.getElementById('sheetHead'),-1,()=>openMenu(false));   // swipe down (or tap) on the sheet handle

// PWA install
let deferred=null;const inst=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;inst.style.display='block';});
inst.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;inst.style.display='none';};
if('serviceWorker' in navigator && location.protocol!=='file:'){
  // 새 버전이 설치되어 화면을 넘겨받으면 한 번 자동 새로고침 (첫 설치 때는 제외)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded&&!camOn){reloaded=true;location.reload();}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
    navigator.serviceWorker.ready.then(()=>{ if(!camOn&&statusEl.textContent.startsWith('손 인식 꺼짐'))status('손 인식 꺼짐 · 오프라인 저장 완료'); });
  }).catch(e=>console.warn('SW',e)));
}

resize();requestAnimationFrame(frame);
</script>
</body>
