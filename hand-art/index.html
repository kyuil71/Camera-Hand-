<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hand Flow Art</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#000;--glass:rgba(12,20,38,.62);--line:rgba(255,255,255,.14);--ink:#f4efe4;--mute:rgba(244,239,228,.66);--accent:#f7c844}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#art,canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
.bar{display:block;width:56px;height:5px;border-radius:3px;background:rgba(190,196,206,.55);transition:background .35s,box-shadow .35s}
body.detect .bar{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.95)}
#grab{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(env(safe-area-inset-bottom) + 64px);display:flex;justify-content:center;padding-top:30px;touch-action:none;transition:opacity .3s}
body.menu #grab{opacity:0;pointer-events:none}
.head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 12px;touch-action:none}
#status{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:center}
#status:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(190,196,206,.6);flex:0 0 auto}
body.detect #status:before{background:#fff;box-shadow:0 0 8px #fff}
.dock{position:fixed;left:50%;bottom:0;z-index:6;transform:translate(-50%,calc(100% + 24px));width:100%;max-width:430px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.menu .dock{transform:translate(-50%,0)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:8px}
.row+.row{margin-top:10px}
.chips{overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;padding:8px 12px 8px 8px;font:inherit;font-size:16px}
.chip i{display:flex;width:44px;height:18px;border-radius:9px;overflow:hidden}
.chip i span{flex:1}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(247,200,68,.14)}
.btn{flex:1;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;font-weight:600}
.btn.main{flex:1.6;background:var(--ink);color:#101826;border-color:transparent}
.btn.main.on{background:#d8262c;color:#fff}
#gyroBtn.on{background:var(--ink);color:#101826}
.btn:active,.chip:active{transform:scale(.97)}
#install{display:none}
.speed{display:flex;align-items:center;gap:12px;margin:0 2px 12px;touch-action:none}
.speed span{font-size:16px;color:var(--mute);flex:0 0 auto}
.speed b{font-size:16px;font-weight:600;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#speed{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;touch-action:none}
#speed::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
#speed::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.seg{gap:0;margin:0 0 12px;border:1px solid var(--line);border-radius:14px;padding:3px;background:rgba(255,255,255,.04)}
.seg button{flex:1;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-size:16px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#101826}
body.water #palettes,body.light #palettes{display:none}
body:not(.light) #lights{display:none}
body:not(.water) #floors,body:not(.water) #dipRow{display:none}
#dipRow{margin-bottom:10px}
#dipBtn.on{background:var(--ink);color:#101826}
.chip i.sw{width:24px;height:18px;border-radius:9px;border:1px solid rgba(255,255,255,.25)}
.hint{font-size:16px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="video" playsinline muted style="display:none"></video>

<div id="grab" aria-label="메뉴 열기"><span class="bar"></span></div>

<div class="dock" id="sheet">
  <div class="panel">
    <div class="head" id="sheetHead"><span class="bar"></span><div id="status">손 인식 꺼짐 · 화면을 문질러 보세요</div></div>
    <div class="row seg" id="modeSeg"><button data-m="paint">물감</button><button data-m="water">물</button><button data-m="light">빛</button></div>
    <div class="speed"><span>흐름 속도</span><input type="range" id="speed" min="0" max="100" step="1"><b id="speedVal"></b></div>
    <div class="row chips" id="palettes"></div>
    <div class="row chips" id="lights"></div>
    <div class="row" id="dipRow"><button class="btn" id="dipBtn">손 담그기 켜기</button></div>
    <div class="row chips" id="floors"><button class="chip" data-f="2"><i class="sw" style="background:linear-gradient(135deg,#000,#1b1d20 50%,#000)"></i>검은 유리</button><button class="chip" data-f="1"><i class="sw" style="background:linear-gradient(135deg,#1c2328,#3a464e 50%,#11171b)"></i>다크 그레이</button><button class="chip" data-f="0"><i class="sw" style="background:linear-gradient(135deg,#8c8270,#c9bda4 45%,#6e675c)"></i>자갈</button></div>
    <div class="row">
      <button class="btn main" id="camBtn">손 인식 시작</button>
      <button class="btn" id="seedBtn">새 캔버스</button>
      <button class="btn" id="snapBtn">저장</button>
    </div>
    <div class="row">
      <button class="btn" id="musicBtn">음악 끄기</button>
      <button class="btn" id="gyroBtn">흔들기 켜기</button>
      <button class="btn" id="fsBtn">전체화면</button>
      <button class="btn" id="install">앱 설치</button>
    </div>
    <p class="hint" id="hintTxt"><b>손가락</b> 흐름 그리기 · <b>검지만 펴기</b> 방향 분사<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 굳히기</p>
    <p class="hint" id="ver">버전 29</p>
  </div>
</div>

<script src="mediapipe/hands.js"></script>
<script>
'use strict';
/* ================= Palettes ================= */
const PALETTES = {
  '아나돌':  ['#0050ff','#00c8ff','#ff5a00','#ffd000','#ff1745','#f2fbff'],
  '심해':    ['#0018a8','#0070ff','#00d5ff','#00ffc8','#7a3cff','#ffffff'],
  '용암':    ['#c4001a','#ff2a00','#ff7a00','#ffc400','#ff0066','#ffe86b'],
  '오로라':  ['#00e08a','#00f5ff','#6b2bff','#ff00c8','#ffe600','#0066ff'],
  '모노':    ['#111418','#3b4048','#8a919c','#d6d9de','#f4f2ec','#5e6570']
};
let paletteName = '아나돌';
const hex2rgb = h => [1,3,5].map(i => parseInt(h.substr(i,2),16)/255);
const pal = () => PALETTES[paletteName].map(hex2rgb);
let palFlat = new Float32Array(pal().flat());

/* ================= WebGL2 setup ================= */
const canvas = document.getElementById('art');
const gl = canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
if(!gl){ document.getElementById('status').textContent='이 기기는 WebGL2를 지원하지 않습니다'; throw new Error('no webgl2'); }
const canRenderFloat = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const IFMT = canRenderFloat ? gl.RGBA16F : gl.RGBA8;
const TYPE = canRenderFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

const VS = `#version 300 es
precision highp float;
in vec2 aPos; uniform vec2 texel;
out vec2 vUv,vL,vR,vT,vB;
void main(){vUv=aPos*.5+.5;vL=vUv-vec2(texel.x,0.);vR=vUv+vec2(texel.x,0.);vT=vUv+vec2(0.,texel.y);vB=vUv-vec2(0.,texel.y);gl_Position=vec4(aPos,0.,1.);}`;
const H = `#version 300 es
precision highp float;precision highp sampler2D;
in vec2 vUv,vL,vR,vT,vB;out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=clamp(p-i,0.,1.);f=f*f*(3.-2.*f);   /* f from p-floor(p): never disagrees with i on any GPU */return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float bristle(vec2 uv,vec2 dims,float sd){vec2 q=uv*dims;return .55*vn(q/2.2+sd)+.3*vn(q/5.+sd*1.7)+.15*vn(q/11.-sd);}
`;
const FS = {
splatVelSet: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float w=clamp(exp(-dot(p,p)/radius)*strength,0.,1.);vec2 b=texture(uT,vUv).xy;o=vec4(mix(b,color.xy,w),0.,1.);}`,
splatVel: H+`uniform sampler2D uT;uniform float aspect,radius;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uT,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
splatDye: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec4 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float g=exp(-dot(p,p)/radius);
float w=clamp(smoothstep(.06,.5,g)*strength,0.,1.);vec4 b=texture(uT,vUv);
o=vec4(mix(b.rgb,color.rgb,w),min(b.a+(w*.7+g*.6)*color.a*strength,3.2));}`,
maccormack: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel,srcTexel;uniform float dt;uniform vec4 diss;
void main(){vec2 v=texture(uVel,vUv).xy*simTexel*dt;vec2 c=vUv-v;vec4 fwd=texture(uSrc,c);
vec2 xf=vUv+v;vec2 vf=texture(uVel,xf).xy*simTexel*dt;vec4 back=texture(uSrc,xf-vf);
vec4 r=fwd+.5*(texture(uSrc,vUv)-back);
vec2 b=(floor(c/srcTexel-.5)+.5)*srcTexel;
vec4 a1=texture(uSrc,b),a2=texture(uSrc,b+vec2(srcTexel.x,0.)),a3=texture(uSrc,b+vec2(0.,srcTexel.y)),a4=texture(uSrc,b+srcTexel);
r=clamp(r,min(min(a1,a2),min(a3,a4)),max(max(a1,a2),max(a3,a4)));
o=r/(1.+diss*dt);}`,
detail: H+`uniform sampler2D uT;uniform vec2 dims;uniform float rate,sd;
void main(){float n=bristle(vUv,dims,sd);o=vec4(mix(rate<1.?texture(uT,vUv).x:n,n,min(rate,1.)),0.,0.,1.);}`,
advect: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel;uniform float dt;uniform vec4 diss;
void main(){vec2 c=vUv-dt*texture(uVel,vUv).xy*simTexel;o=texture(uSrc,c)/(1.+diss*dt);}`,
advectVel: H+`uniform sampler2D uVel;uniform vec2 simTexel;uniform float dt,diss,bounce;
void main(){vec2 c=vUv-dt*texture(uVel,vUv).xy*simTexel;vec2 f=vec2(1.);
if(c.x<0.){c.x=-c.x;f.x=-bounce;}else if(c.x>1.){c.x=2.-c.x;f.x=-bounce;}
if(c.y<0.){c.y=-c.y;f.y=-bounce;}else if(c.y>1.){c.y=2.-c.y;f.y=-bounce;}
o=vec4(texture(uVel,c).xy*f/(1.+diss*dt),0.,1.);}`,
tiltForce: H+`uniform sampler2D uVel,uDye;uniform vec2 force;uniform float k;
void main(){vec4 d=texture(uDye,vUv);float dens=d.a+dot(d.rgb,vec3(.3,.5,.2))*.6-1.15;
o=vec4(texture(uVel,vUv).xy+force*dens*k,0.,1.);}`,
divergence: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).x,R=texture(uVel,vR).x,T=texture(uVel,vT).y,B=texture(uVel,vB).y;vec2 C=texture(uVel,vUv).xy;
if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
curl: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).y,R=texture(uVel,vR).y,T=texture(uVel,vT).x,B=texture(uVel,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
vorticity: H+`uniform sampler2D uVel,uCurl;uniform float curl,dt;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;
vec2 v=texture(uVel,vUv).xy+f*dt;o=vec4(clamp(v,-1000.,1000.),0.,1.);}`,
pressure: H+`uniform sampler2D uP,uDiv;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;o=vec4((L+R+T+B-texture(uDiv,vUv).x)*.25,0.,0.,1.);}`,
gradient: H+`uniform sampler2D uP,uVel;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;vec2 v=texture(uVel,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`,
scale: H+`uniform sampler2D uT;uniform float value;void main(){o=value*texture(uT,vUv);}`,
ambient: H+`uniform sampler2D uVel;uniform float t,amp,dt;
vec2 swirl(vec2 u,vec2 c,float r,float s){vec2 d=u-c;return vec2(-d.y,d.x)*exp(-dot(d,d)/r)*s;}
void main(){vec2 u=vUv;
vec2 f=vec2(sin(u.y*2.3+t*.31)+.5*sin(u.y*5.1+u.x*2.2-t*.58)+.16*sin(u.y*11.+u.x*3.-t*1.05),
            cos(u.x*2.0-t*.27)+.5*cos(u.x*4.7-u.y*2.4+t*.49)+.16*cos(u.x*10.-u.y*4.+t*.88));
f+=swirl(u,vec2(.5+.32*sin(t*.11),.5+.3*cos(t*.14)),.07,26.);
f-=swirl(u,vec2(.5+.3*cos(t*.09+2.),.5+.34*sin(t*.12+1.)),.05,30.);
f+=swirl(u,vec2(.5+.25*sin(t*.17+4.),.5+.25*sin(t*.07+3.)),.02,40.);
o=vec4(texture(uVel,vUv).xy+f*amp*dt,0.,1.);}`,
init: H+`uniform vec3 pal[6];uniform float seed,aspect;
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
void main(){vec2 p=vUv*vec2(aspect,1.)*1.25+seed;float n=fbm(p);float m=fbm(p*1.7+n*3.+seed*.3);
float k=fract(n*1.9+m*1.3)*6.;int i=int(k);vec3 c=mix(pal[i],pal[(i+1)%6],smoothstep(.55,1.,fract(k)));
o=vec4(c,.4+1.6*m*m+.4*sin(k*3.14));}`,
display: H+`uniform sampler2D uDye,uDet;uniform vec3 pal[6];uniform vec2 dyeTexel;uniform float dotSize,relief,time;
float Hh(vec2 uv){vec4 d=texture(uDye,uv);float t=texture(uDet,uv).x;
return d.a*.78+dot(d.rgb,vec3(.3,.5,.2))*.22+(t-.5)*(.12+.1*d.a);}
vec2 grd(vec2 uv,vec2 e){return vec2(Hh(uv-vec2(e.x,0.))-Hh(uv+vec2(e.x,0.)),Hh(uv-vec2(0.,e.y))-Hh(uv+vec2(0.,e.y)));}
void main(){vec4 d=texture(uDye,vUv);float t=texture(uDet,vUv).x;
vec2 g=grd(vUv,dyeTexel*1.2)*.42+grd(vUv,dyeTexel*4.)*.5+grd(vUv,dyeTexel*11.)*.45;
vec3 n=normalize(vec3(g*relief,1.));
vec3 L=normalize(vec3(-.42,.62,.66));vec3 Hv=normalize(L+vec3(0.,0.,1.));
float diff=max(dot(n,L),0.);
float nh=max(dot(n,Hv),0.);float spec=pow(nh,70.)*1.05+pow(nh,12.)*.16;
float fres=pow(1.-n.z,2.);
float hC=Hh(vUv),hW=0.;for(int i=0;i<4;i++){float a=float(i)*1.5708+.6;hW+=Hh(vUv+vec2(cos(a),sin(a))*dyeTexel*9.);}hW*=.25;
float ao=clamp(1.-(hW-hC)*1.8,.4,1.12);
float lum=dot(d.rgb,vec3(.3,.55,.15));
vec3 nc=pal[0];float nd=1e3;for(int i=0;i<6;i++){vec3 q=d.rgb-pal[i];float dd=dot(q,q);if(dd<nd){nd=dd;nc=pal[i];}}
vec3 base=mix(d.rgb,nc,.55);base=max(mix(vec3(dot(base,vec3(.3,.55,.15))),base,1.4),0.);
base*=.9+.2*t;
vec3 c=base*(.28+.9*diff)*ao+spec*vec3(1.,.97,.92)*(.6+.4*min(d.a,1.5))+fres*base*.35;
vec2 q=gl_FragCoord.xy/dotSize;vec2 id=floor(q);vec2 f=q-id-.5;float h1=hash(id);
f+=(vec2(h1,hash(id+7.31))-.5)*.45;
float br=clamp(dot(c,vec3(.33)),0.,1.);float r=.36+.16*br+.06*h1;
float dm=1.-smoothstep(r-.17,r,length(f));
c=mix(c*.8,c*(1.03+.1*h1),dm);
c+=step(.988,hash(id+floor(time*4.)))*spec*.7;
c+=(hash(gl_FragCoord.xy+fract(time)*91.)-.5)*.025;
c=1.-exp(-c*1.6);c=clamp(mix(vec3(dot(c,vec3(.3,.55,.15))),c,1.18),0.,1.);o=vec4(c,1.);}`,
wallVel: H+`uniform sampler2D uVel;uniform float aspect,dt;uniform vec2 simTexel;
void main(){vec2 v=texture(uVel,vUv).xy;
vec4 d=vec4(vUv.x*aspect,(1.-vUv.x)*aspect,vUv.y,1.-vUv.y);
vec2 wp[4];wp[0]=vec2(simTexel.x*1.5,vUv.y);wp[1]=vec2(1.-simTexel.x*1.5,vUv.y);wp[2]=vec2(vUv.x,simTexel.y*1.5);wp[3]=vec2(vUv.x,1.-simTexel.y*1.5);
vec2 n[4];n[0]=vec2(-1.,0.);n[1]=vec2(1.,0.);n[2]=vec2(0.,-1.);n[3]=vec2(0.,1.);
for(int i=0;i<4;i++){float k=smoothstep(.0,.012,d[i])*smoothstep(.08,.02,d[i]);if(k<=0.)continue;
 vec2 vw=texture(uVel,wp[i]).xy;float hit=max(dot(vw,n[i]),0.);
 vec2 tg=vec2(-n[i].y,n[i].x);float st=dot(vw,tg);
 v-=n[i]*hit*k*dt*22.;                         // rebound off the wall (출렁) — exaggerated
 v+=tg*sign(st+1e-4)*hit*k*dt*5.;}              // and run along it
o=vec4(v,0.,1.);}`,
wallPile: H+`uniform sampler2D uDye,uVel;uniform float aspect,dt;
void main(){vec4 c=texture(uDye,vUv);vec2 v=texture(uVel,vUv).xy;
vec4 d=vec4(vUv.x*aspect,(1.-vUv.x)*aspect,vUv.y,1.-vUv.y);
float imp=max(-v.x,0.)*smoothstep(.02,0.,d.x)+max(v.x,0.)*smoothstep(.02,0.,d.y)+max(-v.y,0.)*smoothstep(.02,0.,d.z)+max(v.y,0.)*smoothstep(.02,0.,d.w);
float band=smoothstep(.03,0.,min(min(d.x,d.y),min(d.z,d.w)));
c.a=min(c.a+max(imp-50.,0.)*dt*.016,3.2);
c.a-=max(c.a-1.,0.)*dt*.9*band;                 // the surge slides back down the wall
o=c;}`,
waterClear: H+`void main(){o=vec4(0.,0.,0.,1.);}`,
partInit: H+`uniform float seed;
void main(){vec2 q=gl_FragCoord.xy;o=vec4(hash(q+seed),hash(q*1.31+seed+7.),hash(q*.77+seed+3.),hash(q*2.13+seed+11.));}`,

/* ================= Water mode (lake) ================= */
let mode='paint'; try{const m=localStorage.getItem('hf-mode');if(m==='water'||m==='light')mode=m;}catch(e){}
let waterTime=0, wAcc=0, dropClock=0, glideClock=0; const gliders=[];

/* ---- 손 담그기: dipping a hand into the water ---- */
let dipMode=false; try{dipMode=localStorage.getItem('hf-dip')==='1';}catch(e){}
const dips=new Map();                 // id → {x,y,t0,depth,on,r,entered}
const DIP_MAX=.16;
function dipStart(id,x,y,r){dips.set(id,{x,y,t0:performance.now(),depth:0,on:true,r,entered:false});}
function dipMove(id,x,y){const d=dips.get(id);if(d&&d.on){d.x+=(x-d.x)*.5;d.y+=(y-d.y)*.5;}}

function waterPress(x,y,depth,r){const u=use('waterPress',[wat.r.tx,wat.r.ty]);gl.uniform1i(u.uT,wat.r.bind(0));

  const now=performance.now();

      const hold=(now-d.t0)/1000;

  if(ambientClock>.6){ambientClock=0;const x=Math.random(),y=Math.random(),a=Math.random()*6.28;
    const big=Math.random()<.3, r=big?.012+Math.random()*.022:.0014+Math.random()*.0035;
    splatDye(x,y,pickColor(Math.random()*6|0),r,big?.85:.75,big?1.1:.8);
    splatVel(x,y,Math.cos(a)*(big?650:380),Math.sin(a)*(big?650:380),big?r*1.4:.004);}
  if(Math.random()<dt*.15)colorTick++;
  // pointing jets: paint streams out of the fingertip in the pointed direction
  for(const h of handInfo){const p=h.point;if(!p)continue;
    const js=1/Math.max(timeScale,.35);
    if(flow>.3){splatVel(p.x,p.y,p.dx*1500*js*dt*60*.5,p.dy*1500*js*dt*60*.5,.0032);
      for(let k=1;k<=3;k++)splatVel(p.x+p.dx/aspect*.04*k,p.y+p.dy*.04*k,p.dx*(1250-k*180)*js*dt*30,p.dy*(1250-k*180)*js*dt*30,.0042);}
    splatDye(p.x,p.y,pickColor(p.c),.0024,.45,.55);
}
  // apply queued splats
  for(const s of queue.splice(0)){
    if(flow>.3){ if(s.set) {const g=1.1/Math.max(timeScale,.35);splatVelSet(s.x,s.y,s.vx*vel.r.w*g,s.vy*vel.r.h*g,s.r*1.25,s.set);}
                 else splatVel(s.x,s.y,s.dx*flow,s.dy*flow,s.r*1.2); }
    if(!s.vOnly)splatDye(s.x,s.y,s.c,s.r,s.s,s.t);
  }
  if(flow>.02&&(Math.abs(motionF[0])+Math.abs(motionF[1]))>.01){
    const u2=use('tiltForce',[vel.r.tx,vel.r.ty]);gl.uniform1i(u2.uVel,vel.r.bind(0));gl.uniform1i(u2.uDye,dye.r.bind(1));
    gl.uniform2f(u2.force,motionF[0],motionF[1]);gl.uniform1f(u2.k,dt*flow*1400./Math.max(timeScale,.35));blit(vel.w);vel.swap();}
  if(flow>.02){simTime+=dt*flow*timeScale;step(dt*flow*timeScale);}
  // display
  const u=use('display',[0,0]);gl.uniform3fv(u.pal,palFlat);gl.uniform1i(u.uDye,dye.r.bind(0));gl.uniform1i(u.uDet,det.r.bind(1));gl.uniform2f(u.dyeTexel,dye.r.tx,dye.r.ty);
  gl.uniform1f(u.dotSize,2.0*dpr);gl.uniform1f(u.relief,11.+7.*(1.-flow));gl.uniform1f(u.time,now*.001);blit(null);
  }
  updateMusic(dt);
  if(snapReq){snapReq=false;canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='hand-flow-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');}
  requestAnimationFrame(frame);
}

const palWrap=document.getElementById('palettes');
function renderPalettes(){palWrap.innerHTML='';for(const name in PALETTES){const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===paletteName);b.innerHTML='<i>'+PALETTES[name].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{paletteName=name;palFlat=new Float32Array(pal().flat());renderPalettes();for(let i=0;i<10;i++)queue.push({x:Math.random(),y:Math.random(),dx:0,dy:0,c:pickColor(i),r:.006,s:.9,t:.6});};
  palWrap.appendChild(b);}}
renderPalettes();
const speedEl=document.getElementById('speed'),speedTxt=document.getElementById('speedVal');
const speedLabel=v=>v<30?'아주 느림':v<45?'느림':v<60?'보통':v<80?'빠름':'아주 빠름';
function applySpeed(v){speedVal=+v;speed=sliderToSpeed(speedVal);if(handAct<.05)timeScale=speed;speedTxt.textContent=speedLabel(speedVal);try{localStorage.setItem('hf-speed',speedVal);}catch(e){}}
speedEl.value=speedVal;applySpeed(speedVal);speedEl.addEventListener('input',e=>applySpeed(e.target.value));
const seedBtn=document.getElementById('seedBtn'),hintTxt=document.getElementById('hintTxt');
const HINTS={paint:hintTxt.innerHTML,
  dip:'<b>손 담그기</b> · 터치: 오래 누를수록 깊게, 톡 누르면 살짝<br>손: 손바닥을 화면 쪽으로 내밀어 오래 둘수록 깊게, 떼면 물이 되솟음',
  light:'<b>손가락</b> 빛의 흐름 밀기 · <b>검지만 펴기</b> 가리킨 방향으로 빛줄기<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 멈춤',
  water:'<b>손가락</b> 물결 만들기 · <b>검지만 펴기</b> 가리킨 방향으로 물결<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 물 멈춤'};
function setMode(m){mode=m;document.body.classList.toggle('water',m==='water');document.body.classList.toggle('light',m==='light');
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  seedBtn.textContent=m==='water'?'잔잔하게':'새 캔버스';hintTxt.innerHTML=(m==='water'&&dipMode)?HINTS.dip:HINTS[m];
  gliders.length=0;queue.length=0;drops.length=0;try{localStorage.setItem('hf-mode',m);}catch(e){}}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode(mode);
seedBtn.onclick=()=>{if(mode==='water'){waterClear();gliders.length=0;}else if(mode==='light'){lightSeedAll();}else seed();drops.length=0;};
const lightWrap=document.getElementById('lights');
function renderLights(){lightWrap.innerHTML='';for(const name in LIGHTS){const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===lightName);b.innerHTML='<i>'+LIGHTS[name].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{lightName=name;lightFlat=new Float32Array(LIGHTS[name].map(hex2rgb).flat());try{localStorage.setItem('hf-light',name);}catch(e){}renderLights();};

const dipBtn=document.getElementById('dipBtn');
function setDip(on){dipMode=on;dipBtn.textContent=on?'손 담그기 끄기':'손 담그기 켜기';dipBtn.classList.toggle('on',on);
  for(const id of dips.keys())dipEnd(id);try{localStorage.setItem('hf-dip',on?'1':'0');}catch(e){}
  if(mode==='water')hintTxt.innerHTML=on?HINTS.dip:HINTS.water;}
dipBtn.onclick=()=>setDip(!dipMode);
function setFloor(v){floorType=v;document.querySelectorAll('#floors .chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.f===v));try{localStorage.setItem('hf-floor4',v);}catch(e){}}
document.querySelectorAll('#floors .chip').forEach(b=>b.onclick=()=>setFloor(+b.dataset.f));setFloor(floorType);
const musicBtn=document.getElementById('musicBtn');
function setMusic(on){musicOn=on;musicBtn.textContent=on?'음악 끄기':'음악 켜기';try{localStorage.setItem('hf-music',on?'on':'off');}catch(e){}
  if(on)tryMusic();else bgm.pause();}
musicBtn.onclick=()=>setMusic(!musicOn);setMusic(musicOn);
document.getElementById('gyroBtn').onclick=()=>setGyro(!gyroOn);
setDip(dipMode);
document.getElementById('snapBtn').onclick=()=>{snapReq=true;};
// true fullscreen (also draws under the camera cut-out / status bar area)
const goFull=()=>{const d=document.documentElement;if(document.fullscreenElement)return;
  const r=(d.requestFullscreen||d.webkitRequestFullscreen);try{const p=r?.call(d,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{});}catch(e){}};
const isApp=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
let wantFull=false,needRefull=false,lastScreen=screen.width+'x'+screen.height,lastResizeT=0;
try{wantFull=localStorage.getItem('hf-full')==='1';}catch(e){}
function setWantFull(v){wantFull=v;try{localStorage.setItem('hf-full',v?'1':'0');}catch(e){}}
document.getElementById('fsBtn').onclick=()=>{if(document.fullscreenElement){setWantFull(false);document.exitFullscreen();}else{setWantFull(true);goFull();}};
addEventListener('resize',()=>{lastResizeT=performance.now();const k=screen.width+'x'+screen.height;
  if(k!==lastScreen){lastScreen=k;if(wantFull)needRefull=true;}});           // folded / unfolded → different screen
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&wantFull&&performance.now()-lastResizeT>1200)setWantFull(false);  // user left fullscreen on purpose
});
addEventListener('pointerdown',()=>{
  if(!wantFull)return;
  if(!document.fullscreenElement){goFull();needRefull=false;}
  else if(needRefull){needRefull=false;document.exitFullscreen().then(goFull).catch(()=>{});}   // re-apply on the new screen (covers the camera cut-out)
},true);
let hideTimer=0;
function wake(){}   // no automatic Fullscreen API (avoids Chrome's fullscreen notice)
const openMenu=v=>document.body.classList.toggle('menu',v);
function swipe(el,dir,fn){let y0=null;
  el.addEventListener('pointerdown',e=>{y0=e.clientY;el.setPointerCapture?.(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(y0==null)return;if((y0-e.clientY)*dir>28){y0=null;fn();}});
  el.addEventListener('pointerup',e=>{if(y0!=null&&Math.abs(y0-e.clientY)<8)fn();y0=null;});
  el.addEventListener('pointercancel',()=>y0=null);}
swipe(document.getElementById('grab'),1,()=>{wake();openMenu(true);});          // swipe up (or tap) on the bar
swipe(document.getElementById('sheetHead'),-1,()=>openMenu(false));   // swipe down (or tap) on the sheet handle

// PWA install
let deferred=null;const inst=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;inst.style.display='block';});
inst.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;inst.style.display='none';};
if('serviceWorker' in navigator && location.protocol!=='file:'){
  // 새 버전이 설치되어 화면을 넘겨받으면 한 번 자동 새로고침 (첫 설치 때는 제외)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded&&!camOn){reloaded=true;location.reload();}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
    navigator.serviceWorker.ready.then(()=>{ if(!camOn&&statusEl.textContent.startsWith('손 인식 꺼짐'))status('손 인식 꺼짐 · 오프라인 저장 완료'); });
  }).catch(e=>console.warn('SW',e)));
}

resize();requestAnimationFrame(frame);
