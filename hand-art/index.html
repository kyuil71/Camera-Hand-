<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hand Flow Art</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#000;--glass:rgba(12,20,38,.62);--line:rgba(255,255,255,.14);--ink:#f4efe4;--mute:rgba(244,239,228,.66);--accent:#f7c844}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#art,canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{pointer-events:none}
.bar{display:block;width:56px;height:5px;border-radius:3px;background:rgba(190,196,206,.55);transition:background .35s,box-shadow .35s}
body.detect .bar{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.95)}
#grab{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(env(safe-area-inset-bottom) + 64px);display:flex;justify-content:center;padding-top:30px;touch-action:none;transition:opacity .3s}
body.menu #grab{opacity:0;pointer-events:none}
.head{display:flex;flex-direction:column;align-items:center;gap:10px;padding:2px 0 12px;touch-action:none}
#status{font-size:16px;color:var(--ink);display:flex;align-items:center;gap:8px;text-align:center}
#status:before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(190,196,206,.6);flex:0 0 auto}
body.detect #status:before{background:#fff;box-shadow:0 0 8px #fff}
.dock{position:fixed;left:50%;bottom:0;z-index:6;transform:translate(-50%,calc(100% + 24px));width:100%;max-width:430px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px);transition:transform .38s cubic-bezier(.2,.8,.2,1)}
body.menu .dock{transform:translate(-50%,0)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:8px}
.row+.row{margin-top:10px}
.chips{overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:999px;padding:8px 12px 8px 8px;font:inherit;font-size:16px}
.chip i{display:flex;width:44px;height:18px;border-radius:9px;overflow:hidden}
.chip i span{flex:1}
.chip[aria-pressed=true]{border-color:var(--accent);background:rgba(247,200,68,.14)}
.btn{flex:1;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:14px;font:inherit;font-size:16px;font-weight:600}
.btn.main{flex:1.6;background:var(--ink);color:#101826;border-color:transparent}
.btn.main.on{background:#d8262c;color:#fff}
#gyroBtn.on{background:var(--ink);color:#101826}
.btn:active,.chip:active{transform:scale(.97)}
#install{display:none}
.speed{display:flex;align-items:center;gap:12px;margin:0 2px 12px;touch-action:none}
.speed span{font-size:16px;color:var(--mute);flex:0 0 auto}
.speed b{font-size:16px;font-weight:600;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#speed{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;touch-action:none}
#speed::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
#speed::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#00c8ff,#ffd000,#ff5a00)}
#speed::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.seg{gap:0;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:14px;padding:3px;background:rgba(255,255,255,.04)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:0 10px;min-height:42px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:inherit;font-size:16px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#101826}
body.water #palettes,body.light #palettes,body.silk #palettes,body.cloud #palettes{display:none}
body:not(.cloud) #clouds{display:none}
body:not(.silk) #silks{display:none}
body:not(.light) #lights{display:none}
body:not(.water) #floors,body:not(.water) #dipRow,body:not(.water) #rainRow{display:none}
#rainRow{margin-bottom:10px}
#dipRow{margin-bottom:10px}
#dipBtn.on{background:var(--ink);color:#101826}
.chip i.sw{width:24px;height:18px;border-radius:9px;border:1px solid rgba(255,255,255,.25)}
.mfx{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:10px 14px;min-height:52px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04);cursor:pointer}
.mfx span{display:flex;flex-direction:column;line-height:1.25}.mfx b{font-size:16px;font-weight:600}.mfx small{font-size:13px;color:var(--mute)}
.mfx input{position:absolute;opacity:0;pointer-events:none}
.mfx i{position:relative;flex:0 0 auto;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);transition:background .25s}
.mfx i:after{content:"OFF";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;font-size:0}
.mfx input:checked+i{background:var(--accent)}.mfx input:checked+i:after{transform:translateX(22px)}
.mfx.off{opacity:.45}
.hint{font-size:16px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.5}
.hint b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="art"></canvas>
<canvas id="fx"></canvas>
<video id="video" playsinline muted style="display:none"></video>

<div id="grab" aria-label="메뉴 열기"><span class="bar"></span></div>

<div class="dock" id="sheet">
  <div class="panel">
    <div class="head" id="sheetHead"><span class="bar"></span><div id="status">손 인식 꺼짐 · 화면을 문질러 보세요</div></div>
    <div class="row seg" id="modeSeg"><button data-m="paint">Pigment</button><button data-m="water">Ripple</button><button data-m="light">Aurora</button><button data-m="silk">Silk</button><button data-m="cloud">Cloud</button></div>
    <div class="speed"><span>흐름 속도</span><input type="range" id="speed" min="0" max="100" step="1"><b id="speedVal"></b></div>
    <div class="row chips" id="palettes"></div>
    <div class="row chips" id="lights"></div>
    <div class="row chips" id="silks"></div>
    <div class="row chips" id="clouds"></div>
    <div class="row chips" id="rainRow"><button class="chip" data-r="0">비 없음</button><button class="chip" data-r="1">이슬비</button><button class="chip" data-r="2">비</button><button class="chip" data-r="3">소나기</button></div>
    <div class="row" id="dipRow"><button class="btn" id="dipBtn">손 담그기 켜기</button></div>
    <div class="row chips" id="floors"><button class="chip" data-f="2"><i class="sw" style="background:linear-gradient(135deg,#000,#1b1d20 50%,#000)"></i>검은 유리</button><button class="chip" data-f="1"><i class="sw" style="background:linear-gradient(135deg,#1c2328,#3a464e 50%,#11171b)"></i>다크 그레이</button><button class="chip" data-f="0"><i class="sw" style="background:linear-gradient(135deg,#8c8270,#c9bda4 45%,#6e675c)"></i>자갈</button></div>
    <div class="row">
      <button class="btn main" id="camBtn">손 인식 시작</button>
      <button class="btn" id="seedBtn">새 캔버스</button>
      <button class="btn" id="snapBtn">저장</button>
    </div>
    <div class="row">
      <button class="btn" id="musicBtn">음악 끄기</button>
      <button class="btn" id="gyroBtn">흔들기 켜기</button>
      <button class="btn" id="fsBtn">전체화면</button>
      <button class="btn" id="install">앱 설치</button>
    </div>
    <label class="mfx" id="mfxRow"><span><b>음악 인터랙션</b><small>Music Interaction</small></span>
      <input type="checkbox" id="mfxSw" role="switch" aria-label="음악 인터랙션 Music Interaction"><i aria-hidden="true"></i></label>
    <p class="hint" id="hintTxt"><b>손가락</b> 흐름 그리기 · <b>검지만 펴기</b> 방향 분사<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 굳히기</p>
    <p class="hint" id="ver">버전 42</p>
  </div>
</div>

<script src="mediapipe/hands.js"></script>
<script>
'use strict';
/* ================= Palettes ================= */
const PALETTES = {
  'Neon':      ['#00F0FF','#FF007F','#FFEF00','#4BFF36','#BF4BF8','#001EFF'],
  'Cyber':     ['#FE0194','#00E5FF','#7C4DFF','#F500EB','#0CD4FF','#EFFE01'],
  'Synthwave': ['#3A0CA3','#7209B7','#B5179E','#F72585','#4361EE','#4CC9F0'],
  'Tropical':  ['#4DEEEA','#74EE15','#FFE700','#F000FF','#001EFF','#00FFA3'],
  'Dream':     ['#FF5BFF','#D34DEE','#7B2BFF','#2AC9F9','#56F1FF','#F72585']
};
let paletteName = 'Neon';
const hex2rgb = h => [1,3,5].map(i => parseInt(h.substr(i,2),16)/255);
const pal = () => PALETTES[paletteName].map(hex2rgb);
let palFlat = new Float32Array(pal().flat());

/* ================= WebGL2 setup ================= */
const canvas = document.getElementById('art');
const gl = canvas.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:false});
if(!gl){ document.getElementById('status').textContent='이 기기는 WebGL2를 지원하지 않습니다'; throw new Error('no webgl2'); }
const canRenderFloat = gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const IFMT = canRenderFloat ? gl.RGBA16F : gl.RGBA8;
const TYPE = canRenderFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;

const VS = `#version 300 es
precision highp float;
in vec2 aPos; uniform vec2 texel;
out vec2 vUv,vL,vR,vT,vB;
void main(){vUv=aPos*.5+.5;vL=vUv-vec2(texel.x,0.);vR=vUv+vec2(texel.x,0.);vT=vUv+vec2(0.,texel.y);vB=vUv-vec2(0.,texel.y);gl_Position=vec4(aPos,0.,1.);}`;
const H = `#version 300 es
precision highp float;precision highp sampler2D;
in vec2 vUv,vL,vR,vT,vB;out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=clamp(p-i,0.,1.);f=f*f*(3.-2.*f);   /* f from p-floor(p): never disagrees with i on any GPU */return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);}
float bristle(vec2 uv,vec2 dims,float sd){vec2 q=uv*dims;return .55*vn(q/2.2+sd)+.3*vn(q/5.+sd*1.7)+.15*vn(q/11.-sd);}
`;
const FS = {
splatVelSet: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float w=clamp(exp(-dot(p,p)/radius)*strength,0.,1.);vec2 b=texture(uT,vUv).xy;o=vec4(mix(b,color.xy,w),0.,1.);}`,
splatVel: H+`uniform sampler2D uT;uniform float aspect,radius;uniform vec2 point;uniform vec3 color;
void main(){vec2 p=vUv-point;p.x*=aspect;o=vec4(texture(uT,vUv).xyz+exp(-dot(p,p)/radius)*color,1.);}`,
splatDye: H+`uniform sampler2D uT;uniform float aspect,radius,strength;uniform vec2 point;uniform vec4 color;
void main(){vec2 p=vUv-point;p.x*=aspect;float g=exp(-dot(p,p)/radius);
float w=clamp(smoothstep(.06,.5,g)*strength,0.,1.);vec4 b=texture(uT,vUv);
o=vec4(mix(b.rgb,color.rgb,w),min(b.a+(w*.7+g*.6)*color.a*strength,3.2));}`,
maccormack: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel,srcTexel;uniform float dt,sharp;uniform vec4 diss;
void main(){vec2 v=texture(uVel,vUv).xy*simTexel*dt;vec2 c=vUv-v;vec4 fwd=texture(uSrc,c);
vec2 xf=vUv+v;vec2 vf=texture(uVel,xf).xy*simTexel*dt;vec4 back=texture(uSrc,xf-vf);
vec4 r=fwd+.5*(texture(uSrc,vUv)-back);
vec2 b=(floor(c/srcTexel-.5)+.5)*srcTexel;
vec4 a1=texture(uSrc,b),a2=texture(uSrc,b+vec2(srcTexel.x,0.)),a3=texture(uSrc,b+vec2(0.,srcTexel.y)),a4=texture(uSrc,b+srcTexel);
r=clamp(r,min(min(a1,a2),min(a3,a4)),max(max(a1,a2),max(a3,a4)));
r=mix(fwd,r,sharp);
o=r/(1.+diss*dt);}`,
detail: H+`uniform sampler2D uT;uniform vec2 dims;uniform float rate,sd;
void main(){float n=bristle(vUv,dims,sd);o=vec4(mix(rate<1.?texture(uT,vUv).x:n,n,min(rate,1.)),0.,0.,1.);}`,
advect: H+`uniform sampler2D uVel,uSrc;uniform vec2 simTexel;uniform float dt;uniform vec4 diss;
void main(){vec2 c=vUv-dt*texture(uVel,vUv).xy*simTexel;o=texture(uSrc,c)/(1.+diss*dt);}`,
advectVel: H+`uniform sampler2D uVel;uniform vec2 simTexel;uniform float dt,diss,bounce;
void main(){vec2 c=vUv-dt*texture(uVel,vUv).xy*simTexel;vec2 f=vec2(1.);
if(c.x<0.){c.x=-c.x;f.x=-bounce;}else if(c.x>1.){c.x=2.-c.x;f.x=-bounce;}
if(c.y<0.){c.y=-c.y;f.y=-bounce;}else if(c.y>1.){c.y=2.-c.y;f.y=-bounce;}
o=vec4(texture(uVel,c).xy*f/(1.+diss*dt),0.,1.);}`,
tiltForce: H+`uniform sampler2D uVel,uDye;uniform vec2 force;uniform float k;
void main(){vec4 d=texture(uDye,vUv);float dens=d.a+dot(d.rgb,vec3(.3,.5,.2))*.6-1.15;
o=vec4(texture(uVel,vUv).xy+force*dens*k,0.,1.);}`,
divergence: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).x,R=texture(uVel,vR).x,T=texture(uVel,vT).y,B=texture(uVel,vB).y;vec2 C=texture(uVel,vUv).xy;
if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`,
curl: H+`uniform sampler2D uVel;
void main(){float L=texture(uVel,vL).y,R=texture(uVel,vR).y,T=texture(uVel,vT).x,B=texture(uVel,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`,
vorticity: H+`uniform sampler2D uVel,uCurl;uniform float curl,dt;
void main(){float L=texture(uCurl,vL).x,R=texture(uCurl,vR).x,T=texture(uCurl,vT).x,B=texture(uCurl,vB).x,C=texture(uCurl,vUv).x;
vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;
vec2 v=texture(uVel,vUv).xy+f*dt;o=vec4(clamp(v,-1000.,1000.),0.,1.);}`,
pressure: H+`uniform sampler2D uP,uDiv;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;o=vec4((L+R+T+B-texture(uDiv,vUv).x)*.25,0.,0.,1.);}`,
gradient: H+`uniform sampler2D uP,uVel;
void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;vec2 v=texture(uVel,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`,
scale: H+`uniform sampler2D uT;uniform float value;void main(){o=value*texture(uT,vUv);}`,
ambient: H+`uniform sampler2D uVel;uniform float t,amp,dt,fine;
vec2 swirl(vec2 u,vec2 c,float r,float s){vec2 d=u-c;return vec2(-d.y,d.x)*exp(-dot(d,d)/r)*s;}
void main(){vec2 u=vUv;
vec2 f=vec2(sin(u.y*2.3+t*.31)+.5*sin(u.y*5.1+u.x*2.2-t*.58)+.16*fine*sin(u.y*11.+u.x*3.-t*1.05),
            cos(u.x*2.0-t*.27)+.5*cos(u.x*4.7-u.y*2.4+t*.49)+.16*fine*cos(u.x*10.-u.y*4.+t*.88));
f+=swirl(u,vec2(.5+.32*sin(t*.11),.5+.3*cos(t*.14)),.07,26.);
f-=swirl(u,vec2(.5+.3*cos(t*.09+2.),.5+.34*sin(t*.12+1.)),.05,30.);
f+=swirl(u,vec2(.5+.25*sin(t*.17+4.),.5+.25*sin(t*.07+3.)),.02,40.*fine);
o=vec4(texture(uVel,vUv).xy+f*amp*dt,0.,1.);}`,
init: H+`uniform vec3 pal[6];uniform float seed,aspect;
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=p*2.03+17.1;a*=.5;}return s;}
void main(){vec2 p=vUv*vec2(aspect,1.)*1.25+seed;float n=fbm(p);float m=fbm(p*1.7+n*3.+seed*.3);
float k=fract(n*1.9+m*1.3)*6.;int i=int(k);vec3 c=mix(pal[i],pal[(i+1)%6],smoothstep(.55,1.,fract(k)));
o=vec4(c,.4+1.6*m*m+.4*sin(k*3.14));}`,
display: H+`uniform sampler2D uDye,uDet;uniform vec3 pal[6];uniform vec2 dyeTexel;uniform float dotSize,relief,time;
float Hh(vec2 uv){vec4 d=texture(uDye,uv);float t=texture(uDet,uv).x;
return d.a*.78+dot(d.rgb,vec3(.3,.5,.2))*.22+(t-.5)*(.05+.04*d.a);}
vec2 grd(vec2 uv,vec2 e){return vec2(Hh(uv-vec2(e.x,0.))-Hh(uv+vec2(e.x,0.)),Hh(uv-vec2(0.,e.y))-Hh(uv+vec2(0.,e.y)));}
void main(){vec4 d=texture(uDye,vUv);float t=texture(uDet,vUv).x;
vec2 g=grd(vUv,dyeTexel*1.5)*.22+grd(vUv,dyeTexel*4.5)*.55+grd(vUv,dyeTexel*12.)*.55;
vec3 n=normalize(vec3(g*relief,1.));
vec3 L=normalize(vec3(-.42,.62,.66));vec3 Hv=normalize(L+vec3(0.,0.,1.));
float diff=max(dot(n,L),0.);
float nh=max(dot(n,Hv),0.);float spec=pow(nh,70.)*1.05+pow(nh,12.)*.16;
float fres=pow(1.-n.z,2.);
float hC=Hh(vUv),hW=0.;for(int i=0;i<4;i++){float a=float(i)*1.5708+.6;hW+=Hh(vUv+vec2(cos(a),sin(a))*dyeTexel*9.);}hW*=.25;
float ao=clamp(1.-(hW-hC)*1.5,.62,1.1);
float lum=dot(d.rgb,vec3(.3,.55,.15));
vec3 nc=pal[0];float nd=1e3;for(int i=0;i<6;i++){vec3 q=d.rgb-pal[i];float dd=dot(q,q);if(dd<nd){nd=dd;nc=pal[i];}}
vec3 base=mix(d.rgb,nc,.6);
{vec3 b=clamp(base,0.,1.);float mx=max(b.r,max(b.g,b.b)),mn=min(b.r,min(b.g,b.b)),dl=mx-mn;   // to HSV
 float hh=0.;if(dl>1e-4){if(mx==b.r)hh=mod((b.g-b.b)/dl,6.);else if(mx==b.g)hh=(b.b-b.r)/dl+2.;else hh=(b.r-b.g)/dl+4.;}
 float sat=mx>0.?dl/mx:0.;
 float S=dl<.02?sat:max(sat,.82),V=max(mx,.72);                                           // force vivid: no muddy / brown / grey mixes
 vec3 k=clamp(abs(mod(hh+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);base=V*mix(vec3(1.),k,S);}
base*=.95+.1*t;
vec3 c=base*(.52+.62*diff)*ao+spec*vec3(1.,.97,.92)*(.6+.4*min(d.a,1.5))+fres*base*.35;
vec2 q=gl_FragCoord.xy/dotSize;vec2 id=floor(q);vec2 f=q-id-.5;float h1=hash(id);
f+=(vec2(h1,hash(id+7.31))-.5)*.45;
float br=clamp(dot(c,vec3(.33)),0.,1.);float r=.36+.16*br+.06*h1;
float dm=1.-smoothstep(r-.17,r,length(f));
c=mix(c*.94,c*(1.02+.04*h1),dm);
c+=step(.988,hash(id+floor(time*4.)))*spec*.7;

  s:{x:.5,y:.5,v:0,pinch:0,seen:0,px:null,py:null,pt:0}, sent:{g:1,p:0,f:20000,w:0}, lastSend:0};
try{MFX.on=localStorage.getItem('hf-mfx')==='1';}catch(e){}
function mfxImpulse(ctx){                       // gentle 2.4 s hall: decaying, slightly darkened stereo noise (built once)
  const sr=ctx.sampleRate,len=Math.floor(sr*2.4),b=ctx.createBuffer(2,len,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;
    for(let i=0;i<len;i++){const t=i/sr,n=Math.random()*2-1;lp+=(n-lp)*(.35-.25*Math.min(1,t/2.4));
      d[i]=lp*Math.pow(1-i/len,2.2)*Math.exp(-t*1.1)*(i<sr*.012?i/(sr*.012):1);}}
  return b;}
function mfxBuild(){
  if(MFX.ctx)return true;
  try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    const ctx=new AC();MFX.ctx=ctx;
    MFX.src=ctx.createMediaElementSource(bgm);                     // only ever once for this element
    MFX.lp=ctx.createBiquadFilter();MFX.lp.type='lowpass';MFX.lp.frequency.value=20000;MFX.lp.Q.value=.5;
    MFX.pan=ctx.createStereoPanner?ctx.createStereoPanner():null;
    MFX.dry=ctx.createGain();MFX.wet=ctx.createGain();MFX.wet.gain.value=0;
    MFX.conv=ctx.createConvolver();MFX.conv.buffer=mfxImpulse(ctx);
    MFX.gain=ctx.createGain();
    const mid=MFX.pan||MFX.lp;
    MFX.src.connect(MFX.lp);if(MFX.pan)MFX.lp.connect(MFX.pan);
    mid.connect(MFX.dry);mid.connect(MFX.conv);MFX.conv.connect(MFX.wet);
    MFX.dry.connect(MFX.gain);MFX.wet.connect(MFX.gain);MFX.gain.connect(ctx.destination);
    return true;}catch(e){console.warn('MFX',e);MFX.ctx=null;return false;}}
function mfxResume(){ if(MFX.ctx&&MFX.ctx.state!=='running')MFX.ctx.resume().catch(()=>{}); }
function mfxSet(param,val,tc){const t=MFX.ctx.currentTime;try{param.cancelScheduledValues(t);param.setTargetAtTime(val,t,tc);}catch(e){param.value=val;}}
// called from the render loop (no extra timers); audio params are touched at most ~8×/s and only when they really change
function mfxUpdate(){
  const S=MFX.s,now=performance.now();const dt=Math.min(.25,(now-(MFX.lastT||now))/1000);MFX.lastT=now;   // real time, independent of frame rate
  const h=handInfo.find(x=>x&&x.palm);
  if(MFX.on&&h){
    const x=h.palm.x,y=h.palm.y;
    const spd=Math.max(0,handAct-.08);                             // existing finger-speed measure; dead zone for jitter
    S.v+=(Math.min(spd,2.5)-S.v)*Math.min(1,dt*(spd>S.v?2.2:.9));
    const a=Math.min(1,dt*1.8);                                    // input smoothing
    if(Math.abs(x-S.x)>.015)S.x+=(x-S.x)*a; if(Math.abs(y-S.y)>.015)S.y+=(y-S.y)*a;
    S.pinch+=((h.pinch?1:0)-S.pinch)*Math.min(1,dt*(h.pinch?1.6:.7));
    S.seen=now;
  } else if(now-S.seen>350){                                      // hand gone (or switch OFF): drift home
    const a=Math.min(1,dt*1.4);S.x+=(.5-S.x)*a;S.y+=(.5-S.y)*a;S.v+=(0-S.v)*a;S.pinch+=(0-S.pinch)*Math.min(1,dt*.9);}
  // presence: eases in over ~0.5 s when a hand appears, back out over ~2 s when it is gone → everything returns home smoothly
  const present=MFX.on&&now-S.seen<350;
  S.pres=(S.pres||0)+((present?1:0)-(S.pres||0))*Math.min(1,dt*(present?2.5:1.1));
  if(!MFX.ctx)return;
  if(now-MFX.lastSend<120)return;MFX.lastSend=now;
  const active=MFX.on&&S.pres>.002,P=S.pres;
  // A: height → 60–100 % of the normal volume (hand high = full, low = softer); B: left/right → pan ±0.5
  const g=active?1+P*(.6+.4*Math.min(1,Math.max(0,(S.y-.15)/.7))-1):1;
  const p=active?P*Math.max(-.5,Math.min(.5,(S.x-.5)*1.1)):0;
  // C: slow hand → warm (≈5.5 kHz), fast hand → bright (≈18 kHz); no hand → untouched (20 kHz)
  const f=active?Math.exp(Math.log(20000)+P*(Math.log(5500*Math.pow(18000/5500,Math.min(1,S.v/1.2)))-Math.log(20000))):20000;
  // D: pinch → up to 22 % wet
  const w=active?.22*S.pinch*P:0;
  const T=MFX.sent;
  if(Math.abs(g-T.g)>.01){mfxSet(MFX.gain.gain,g,.35);T.g=g;}
  if(MFX.pan&&Math.abs(p-T.p)>.01){mfxSet(MFX.pan.pan,p,.4);T.p=p;}
  if(Math.abs(Math.log(f/T.f))>.03){mfxSet(MFX.lp.frequency,f,.3);T.f=f;}
  if(Math.abs(w-T.w)>.005){mfxSet(MFX.wet.gain,w,.45);mfxSet(MFX.dry.gain,1-w*.35,.45);T.w=w;}

function setMfx(on,fromUser){
  MFX.on=on;try{localStorage.setItem('hf-mfx',on?'1':'0');}catch(e){}
  const sw=document.getElementById('mfxSw');if(sw)sw.checked=on;
  if(on&&fromUser){ if(mfxBuild())mfxResume(); }
  if(!on&&MFX.ctx){const T=MFX.sent;mfxSet(MFX.gain.gain,1,.4);if(MFX.pan)mfxSet(MFX.pan.pan,0,.4);mfxSet(MFX.lp.frequency,20000,.4);
    mfxSet(MFX.wet.gain,0,.4);mfxSet(MFX.dry.gain,1,.4);T.g=1;T.p=0;T.f=20000;T.w=0;}            // AudioContext is created inside the tap → mobile autoplay rules
}

const fx=document.getElementById('fx');const fxc=fx.getContext('2d');
const queue=[];           // deferred GPU splats
let ambientClock=0, colorTick=0;
const pickColor=(i)=>{const p=pal();const c=p[(i+colorTick)%p.length];const k=.9+Math.random()*.25;return c.map(v=>Math.min(1,v*k));};

// touch fallback
const pointers=new Map();
canvas.addEventListener('pointerdown',e=>{if(document.body.classList.contains('menu')){openMenu(false);return;}pointers.set(e.pointerId,{x:e.clientX/innerWidth,y:1-e.clientY/innerHeight,t:e.timeStamp,c:pickColor(pointers.size+(Math.random()*6|0))});wake();
  if(mode==='water'&&dipMode)dipStart('t'+e.pointerId,e.clientX/innerWidth,1-e.clientY/innerHeight,.005);});
canvas.addEventListener('pointermove',e=>{const p=pointers.get(e.pointerId);if(!p)return;
  const x=e.clientX/innerWidth,y=1-e.clientY/innerHeight;const dtR=Math.min(Math.max((e.timeStamp-p.t)/1000,.008),.1);feelFinger(Math.hypot((x-p.x)*aspect,y-p.y)/dtR);
  queue.push({x,y,vx:(x-p.x)/dtR,vy:(y-p.y)/dtR,set:.85,c:p.c,r:.0032,s:.9});p.x=x;p.y=y;p.t=e.timeStamp;

// hand state
const TIPS=[4,8,12,16,20];
const tracks={};            // key `${hand}-${tip}` -> {x,y}
let hands=null, handsReady=false, camOn=false, busy=false, lastSeen=0, fistSince=0, handInfo=[];
const pinchState={}, pointState={}, handSize={};
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function onHands(res){
  const now=performance.now();const q0=queue.length;
  const list=res.multiHandLandmarks||[];
  if(!list.length){ if(now-lastSeen>250){for(const k in tracks)delete tracks[k];for(const k in pointState)delete pointState[k];} handInfo=[]; setDetect(false); if(camOn)status('손 인식 켜짐 · 손을 카메라에 보여주세요'); fistSince=0; return; }
  lastSeen=now; handInfo=[]; setDetect(true);
  const seenH={};
  let anyFist=false;
  list.forEach((lm,h)=>{
    const size=d2(lm[0],lm[9])||.1;
    const fist=[8,12,16,20].every(i=>d2(lm[i],lm[0])<size*1.15);
    const pinch=!fist && d2(lm[4],lm[8])<size*.38;
    const pointing=!fist && !pinch && d2(lm[8],lm[0])>size*1.5 && [12,16,20].every(i=>d2(lm[i],lm[0])<size*1.25);
    let point=null;
    if(pointing){
      let dx=(lm[8].x-lm[5].x)*aspect, dy=-(lm[8].y-lm[5].y); const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
      const ps=pointState[h]; if(ps){dx=ps.dx+(dx-ps.dx)*.45;dy=ps.dy+(dy-ps.dy)*.45;const l2=Math.hypot(dx,dy)||1;dx/=l2;dy/=l2;}
      point={x:lm[8].x,y:1-lm[8].y,dx,dy,c:pointState[h]?.c??((Math.random()*6)|0)};
      pointState[h]=point;
    } else delete pointState[h];
    anyFist=anyFist||fist;
    const pts=[];
    TIPS.forEach((ti,j)=>{
      const raw={x:lm[ti].x, y:1-lm[ti].y};       // selfieMode=true already mirrors
      const key=h+'-'+ti; const prev=tracks[key];
      const sm=prev?{x:prev.x+(raw.x-prev.x)*.6,y:prev.y+(raw.y-prev.y)*.6,t:now}:{...raw,t:now};
      tracks[key]=sm; pts.push(sm);
      if(!prev||fist||(pointing&&ti!==8))return;
      let dx=sm.x-prev.x, dy=sm.y-prev.y; const sp=Math.hypot(dx,dy);
      if(sp>.25)return;                               // tracking jump
      const isIndex=ti===8, strong=isIndex?1:.55;
      const dtR=Math.min(Math.max((now-prev.t)/1000,.016),.12);
      feelFinger(Math.hypot(dx*aspect,dy)/dtR*(isIndex?1:.8));
      queue.push({x:sm.x,y:sm.y,vx:dx/dtR,vy:dy/dtR,set:isIndex?.85:.45,c:pickColor(j+h*2),r:isIndex?.0034:.0019,s:Math.min(1,.12+sp*40)*strong,t:isIndex?.7:.4});
    });
    // pinch → vortex around pinch point
    const pk='p'+h, mid={x:(lm[4].x+lm[8].x)/2,y:1-(lm[4].y+lm[8].y)/2};
    if(pinch){
      if(!pinchState[pk]){ // burst on pinch start
        colorTick++;
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2;queue.push({x:mid.x+Math.cos(a)*.02,y:mid.y+Math.sin(a)*.02,dx:Math.cos(a)*900,dy:Math.sin(a)*900,c:pickColor(i),r:.0024,s:1,t:.9});}
      }
      const dir=(h===0?1:-1);
      for(let i=0;i<8;i++){const a=i/8*Math.PI*2+now*.002;const R=.07;
        queue.push({x:mid.x+Math.cos(a)*R,y:mid.y+Math.sin(a)*R*aspect,dx:-Math.sin(a)*(250+500*Math.min(speed,2))*dir,dy:Math.cos(a)*(250+500*Math.min(speed,2))*dir,r:.0045,vOnly:true});}
    }
    pinchState[pk]=pinch;
    const open=!fist&&!pinch&&!pointing&&[8,12,16,20].every(i=>d2(lm[i],lm[0])>size*1.55);
    handInfo.push({pts,fist,pinch,mid,point,open,palm:{x:lm[9].x,y:1-lm[9].y}});
    // 손 담그기 gesture: palm moves toward the screen relative to its resting size
    const hs=handSize[h]||(handSize[h]={base:size,dipping:false}),palm={x:lm[9].x,y:1-lm[9].y};seenH[h]=1;

    else{ if(ratio<1.06||!dipMode||mode!=='water'){hs.dipping=false;dipEnd('h'+h);} else dipMove('h'+h,palm.x,palm.y);}
  });
  for(const k in handSize)if(!seenH[k]&&handSize[k].dipping){handSize[k].dipping=false;dipEnd('h'+k);}
  if(anyFist){ if(!fistSince)fistSince=now; } else fistSince=0;
  flowTarget = (fistSince && now-fistSince>160) ? 0 : 1;
  for(let k=q0;k<queue.length;k++)queue[k].hand=1;
  status(`카메라 인식됨 · 손 ${list.length}개${flowTarget?'':' · 굳힘'}${handInfo.some(x=>x.point)?' · 가리키기':''}`);
}

async function startCam(){
  try{
    status('AI 모델 불러오는 중…');camBtn.disabled=true;

      hands=new Hands({locateFile:f=>'mediapipe/'+f});

    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}});
    video.srcObject=stream;await video.play();

  }catch(err){console.error(err);status(err.name==='NotAllowedError'?'카메라 권한이 거부되었어요':'시작 실패: '+(err.message||err));}

  camBtn.textContent='손 인식 시작';camBtn.classList.remove('on');handInfo=[];flowTarget=1;fistSince=0;for(const k in tracks)delete tracks[k];
  try{wakeLock&&wakeLock.release();}catch(e){} status('손 인식 꺼짐 · 화면을 문질러 보세요');}

/* fingertip glow overlay */
function drawFx(){
  fxc.clearRect(0,0,fx.width,fx.height);
  if(!handInfo.length)return;
  fxc.lineWidth=1.5*dpr;
  for(const h of handInfo){
    h.pts.forEach((p,i)=>{const x=p.x*fx.width,y=(1-p.y)*fx.height;const r=(i===1?11:7)*dpr*(h.fist?.7:1);
      fxc.strokeStyle=h.fist?'rgba(255,255,255,.35)':'rgba(255,248,230,.75)';fxc.beginPath();fxc.arc(x,y,r,0,7);fxc.stroke();});
    if(h.point){const p=h.point,x=p.x*fx.width,y=(1-p.y)*fx.height,L=46*dpr,ex=x+p.dx*L,ey=y-p.dy*L,a=Math.atan2(-p.dy,p.dx);
      fxc.strokeStyle='rgba(255,248,230,.85)';fxc.lineWidth=2*dpr;fxc.beginPath();fxc.moveTo(x,y);fxc.lineTo(ex,ey);
      fxc.moveTo(ex,ey);fxc.lineTo(ex-Math.cos(a-.5)*12*dpr,ey-Math.sin(a-.5)*12*dpr);fxc.moveTo(ex,ey);fxc.lineTo(ex-Math.cos(a+.5)*12*dpr,ey-Math.sin(a+.5)*12*dpr);fxc.stroke();fxc.lineWidth=1.5*dpr;}

  }
}

/* ================= Main loop ================= */
let last=performance.now(), snapReq=false;
function frame(now){
  const dt=Math.min((now-last)/1000,1/30);last=now;
  resize();
  flow+=(flowTarget-flow)*Math.min(1,dt*(flowTarget>flow?2.5:6));
  updateGyro(dt);updateTimeScale(dt);
  if(mode==='water'){ waterFrame(dt); } else if(mode==='light'){ lightFrame(dt); } else if(mode==='silk'){ queue.length=0; silkFrame(dt); } else if(mode==='cloud'){ cloudFrame(dt); } else {
  // ambient life: drifting color drops keep the canvas evolving
  ambientClock+=dt*flow*Math.max(timeScale,.15);
  if(ambientClock>.6){ambientClock=0;const x=Math.random(),y=Math.random(),a=Math.random()*6.28;
    const rr=Math.random(), big=rr<.55, r=big?.014+Math.random()*.026:(rr<.85?.005+Math.random()*.006:.0028+Math.random()*.002);
    splatDye(x,y,pickColor(Math.random()*6|0),r,big?.85:.75,big?1.1:.8);
    splatVel(x,y,Math.cos(a)*(big?650:380),Math.sin(a)*(big?650:380),big?r*1.4:.004);}
  if(Math.random()<dt*.15)colorTick++;
  // pointing jets: paint streams out of the fingertip in the pointed direction
  for(const h of handInfo){const p=h.point;if(!p)continue;
    const js=1/Math.max(timeScale,.35);
    if(flow>.3){splatVel(p.x,p.y,p.dx*1500*js*dt*60*.5,p.dy*1500*js*dt*60*.5,.0032);
      for(let k=1;k<=3;k++)splatVel(p.x+p.dx/aspect*.04*k,p.y+p.dy*.04*k,p.dx*(1250-k*180)*js*dt*30,p.dy*(1250-k*180)*js*dt*30,.0042);}
    splatDye(p.x,p.y,pickColor(p.c),.0024,.45,.55);
}
  // apply queued splats
  for(const s of queue.splice(0)){
    if(flow>.3){ if(s.set) {const g=1.1/Math.max(timeScale,.35);splatVelSet(s.x,s.y,s.vx*vel.r.w*g,s.vy*vel.r.h*g,s.r*1.25,s.set);}
                 else splatVel(s.x,s.y,s.dx*flow,s.dy*flow,s.r*1.2); }
    if(!s.vOnly)splatDye(s.x,s.y,s.c,s.r,s.s,s.t);
  }
  if(flow>.02&&(Math.abs(motionF[0])+Math.abs(motionF[1]))>.01){
    const u2=use('tiltForce',[vel.r.tx,vel.r.ty]);gl.uniform1i(u2.uVel,vel.r.bind(0));gl.uniform1i(u2.uDye,dye.r.bind(1));
    gl.uniform2f(u2.force,motionF[0],motionF[1]);gl.uniform1f(u2.k,dt*flow*1400./Math.max(timeScale,.35));blit(vel.w);vel.swap();}
  if(flow>.02){simTime+=dt*flow*timeScale;step(dt*flow*timeScale);}
  // display
  const u=use('display',[0,0]);gl.uniform3fv(u.pal,palFlat);gl.uniform1i(u.uDye,dye.r.bind(0));gl.uniform1i(u.uDet,det.r.bind(1));gl.uniform2f(u.dyeTexel,dye.r.tx,dye.r.ty);
  gl.uniform1f(u.dotSize,2.0*dpr);gl.uniform1f(u.relief,11.+7.*(1.-flow));gl.uniform1f(u.time,now*.001);blit(null);
  }
  updateMusic(dt);
  if(snapReq){snapReq=false;canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='hand-flow-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');}
  requestAnimationFrame(frame);
}

  dip:'<b>손 담그기</b> · 터치: 오래 누를수록 깊게, 톡 누르면 살짝<br>손: 손바닥을 화면 쪽으로 내밀어 오래 둘수록 깊게, 떼면 물이 되솟음',
  cloud:'<b>검지</b> 지나간 구름이 부드럽게 갈라짐 · 빠르게 움직이면 흩어짐<br><b>집기</b> 회전 흐름 · <b>손 펼치기</b> 넓게 확산 · <b>주먹</b> 천천히 안정',
  silk:'<b>검지</b> 실크가 따라 흐름 · 빠르게 움직이면 넓게 펼쳐짐<br><b>집기</b> 부드러운 소용돌이 · <b>손 펼치기</b> 활짝 펼침 · <b>주먹</b> 서서히 멈춤',
  light:'<b>손가락</b> 빛의 흐름 밀기 · <b>검지만 펴기</b> 가리킨 방향으로 빛줄기<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 멈춤',
  water:'<b>검지 하나</b> 손끝이 물에 닿은 듯 움직임<br><b>엄지+검지 집기</b> 소용돌이 · <b>주먹</b> 물 멈춤'};
function setMode(m){mode=m;document.body.classList.toggle('water',m==='water');document.body.classList.toggle('light',m==='light');document.body.classList.toggle('silk',m==='silk');document.body.classList.toggle('cloud',m==='cloud');
  if(m==='cloud'&&vel){const u=use('waterClear',[0,0]);blit(vel.w);vel.swap();blit(vel.w);vel.swap();}   // start calm: no leftover swirls from other modes
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  seedBtn.textContent=m==='water'?'잔잔하게':'새 캔버스';hintTxt.innerHTML=(m==='water'&&dipMode)?HINTS.dip:HINTS[m];
  gliders.length=0;queue.length=0;drops.length=0;try{localStorage.setItem('hf-mode',m);}catch(e){}
  if(curTrack)switchTrack();}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
setMode(mode);
seedBtn.onclick=()=>{if(mode==='water'){waterClear();gliders.length=0;}else if(mode==='light'){lightSeedAll();}else if(mode==='silk'){silkInit();}else if(mode==='cloud'){cloudReset();}else seed();drops.length=0;};
const lightWrap=document.getElementById('lights');
function renderLights(){lightWrap.innerHTML='';for(const name in LIGHTS){const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===lightName);b.innerHTML='<i>'+LIGHTS[name].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{lightName=name;lightFlat=new Float32Array(LIGHTS[name].map(hex2rgb).flat());try{localStorage.setItem('hf-light',name);}catch(e){}renderLights();};
  lightWrap.appendChild(b);}}
renderLights();
const silkWrap=document.getElementById('silks');
function renderSilks(){silkWrap.innerHTML='';for(const name in SILKS){const b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===silkName);b.innerHTML='<i>'+SILKS[name].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{silkName=name;try{localStorage.setItem('hf-silk',name);}catch(e){}renderSilks();};silkWrap.appendChild(b);}}
renderSilks();
const cloudWrap=document.getElementById('clouds');
function renderClouds(){cloudWrap.innerHTML='';for(const name in CLOUDS){const st=CLOUDS[name],b=document.createElement('button');b.className='chip';
  b.setAttribute('aria-pressed',name===cloudName);b.innerHTML='<i>'+[st.top,st.shd,st.lit,st.bot].map(c=>`<span style="background:${c}"></span>`).join('')+'</i>'+name;
  b.onclick=()=>{cloudName=name;try{localStorage.setItem('hf-cloud',name);}catch(e){}renderClouds();};cloudWrap.appendChild(b);}}
renderClouds();
const dipBtn=document.getElementById('dipBtn');
function setDip(on){dipMode=on;dipBtn.textContent=on?'손 담그기 끄기':'손 담그기 켜기';dipBtn.classList.toggle('on',on);
  for(const id of dips.keys())dipEnd(id);try{localStorage.setItem('hf-dip',on?'1':'0');}catch(e){}
  if(mode==='water')hintTxt.innerHTML=on?HINTS.dip:HINTS.water;}
dipBtn.onclick=()=>setDip(!dipMode);
function setRain(v){rainLevel=v;document.querySelectorAll('#rainRow .chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.r===v));try{localStorage.setItem('hf-rain',v);}catch(e){}}
document.querySelectorAll('#rainRow .chip').forEach(b=>b.onclick=()=>setRain(+b.dataset.r));setRain(rainLevel);
function setFloor(v){floorType=v;document.querySelectorAll('#floors .chip').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.f===v));try{localStorage.setItem('hf-floor4',v);}catch(e){}}
document.querySelectorAll('#floors .chip').forEach(b=>b.onclick=()=>setFloor(+b.dataset.f));setFloor(floorType);
const musicBtn=document.getElementById('musicBtn');
function setMusic(on){musicOn=on;musicBtn.textContent=on?'음악 끄기':'음악 켜기';try{localStorage.setItem('hf-music',on?'on':'off');}catch(e){}
  if(on)tryMusic();else bgm.pause();}
musicBtn.onclick=()=>setMusic(!musicOn);setMusic(musicOn);
const mfxSw=document.getElementById('mfxSw'),mfxRow=document.getElementById('mfxRow');
mfxSw.addEventListener('change',()=>setMfx(mfxSw.checked,true));
setMfx(MFX.on,false);
const _setMusic=setMusic;setMusic=function(on){_setMusic(on);mfxRow.classList.toggle('off',!on);};mfxRow.classList.toggle('off',!musicOn);
document.getElementById('gyroBtn').onclick=()=>setGyro(!gyroOn);
setDip(dipMode);
document.getElementById('snapBtn').onclick=()=>{snapReq=true;};
// true fullscreen (also draws under the camera cut-out / status bar area)
const goFull=()=>{const d=document.documentElement;if(document.fullscreenElement)return;
  const r=(d.requestFullscreen||d.webkitRequestFullscreen);try{const p=r?.call(d,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{});}catch(e){}};
const isApp=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches;
let wantFull=false,needRefull=false,lastScreen=screen.width+'x'+screen.height,lastResizeT=0;
try{wantFull=localStorage.getItem('hf-full')==='1';}catch(e){}
function setWantFull(v){wantFull=v;try{localStorage.setItem('hf-full',v?'1':'0');}catch(e){}}
document.getElementById('fsBtn').onclick=()=>{if(document.fullscreenElement){setWantFull(false);document.exitFullscreen();}else{setWantFull(true);goFull();}};
addEventListener('resize',()=>{lastResizeT=performance.now();const k=screen.width+'x'+screen.height;
  if(k!==lastScreen){lastScreen=k;if(wantFull)needRefull=true;}});           // folded / unfolded → different screen
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&wantFull&&performance.now()-lastResizeT>1200)setWantFull(false);  // user left fullscreen on purpose
});
addEventListener('pointerdown',()=>{
  if(!wantFull)return;
  if(!document.fullscreenElement){goFull();needRefull=false;}
  else if(needRefull){needRefull=false;document.exitFullscreen().then(goFull).catch(()=>{});}   // re-apply on the new screen (covers the camera cut-out)
},true);
let hideTimer=0;
function wake(){}   // no automatic Fullscreen API (avoids Chrome's fullscreen notice)
const openMenu=v=>document.body.classList.toggle('menu',v);
function swipe(el,dir,fn){let y0=null;
  el.addEventListener('pointerdown',e=>{y0=e.clientY;el.setPointerCapture?.(e.pointerId);});
  el.addEventListener('pointermove',e=>{if(y0==null)return;if((y0-e.clientY)*dir>28){y0=null;fn();}});
  el.addEventListener('pointerup',e=>{if(y0!=null&&Math.abs(y0-e.clientY)<8)fn();y0=null;});
  el.addEventListener('pointercancel',()=>y0=null);}
swipe(document.getElementById('grab'),1,()=>{wake();openMenu(true);});          // swipe up (or tap) on the bar
swipe(document.getElementById('sheetHead'),-1,()=>openMenu(false));   // swipe down (or tap) on the sheet handle

// PWA install
let deferred=null;const inst=document.getElementById('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;inst.style.display='block';});
inst.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;inst.style.display='none';};
if('serviceWorker' in navigator && location.protocol!=='file:'){
  // 새 버전이 설치되어 화면을 넘겨받으면 한 번 자동 새로고침 (첫 설치 때는 제외)
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded&&!camOn){reloaded=true;location.reload();}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    r.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});
    navigator.serviceWorker.ready.then(()=>{ if(!camOn&&statusEl.textContent.startsWith('손 인식 꺼짐'))status('손 인식 꺼짐 · 오프라인 저장 완료'); });
  }).catch(e=>console.warn('SW',e)));
}

// keep the screen from auto-rotating while the app runs (works in the installed app / fullscreen)
function lockOrientation(){try{const o=screen.orientation;if(o&&o.lock)o.lock('portrait').catch(()=>{});}catch(e){}}
lockOrientation();
addEventListener('pointerdown',lockOrientation,{capture:true,once:true});
document.addEventListener('fullscreenchange',lockOrientation);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lockOrientation();});
resize();requestAnimationFrame(frame);
</script>
